<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПЕРЕКУП PRO — торгуйся и богатей</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070912;
  --blob1:#6d28d9;--blob2:#0e7490;--blob3:#b45309;
  --panel:rgba(22,26,44,.78);--panel2:rgba(32,38,62,.68);
  --stroke:rgba(255,255,255,.10);--txt:#eef1fb;--muted:#8b93ad;
  --gold:#ffd166;--gold2:#ffb020;--violet:#8b5cf6;--green:#34d399;
  --red:#f87171;--blue:#60a5fa;--orange:#fb923c;
}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .4s ease}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(255,209,102,.4),rgba(139,92,246,.4));border-radius:10px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,rgba(255,209,102,.7),rgba(139,92,246,.7))}

.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(110px);opacity:.55;transition:background .6s ease}
.b1{width:600px;height:600px;background:var(--blob1);top:-180px;left:-160px;animation:f1 22s ease-in-out infinite}
.b2{width:520px;height:520px;background:var(--blob2);bottom:-180px;right:-140px;animation:f2 26s ease-in-out infinite}
.b3{width:460px;height:460px;background:var(--blob3);top:45%;left:52%;opacity:.25;animation:f3 30s ease-in-out infinite}
@keyframes f1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(100px,80px) scale(1.18)}}
@keyframes f2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-100px,-70px) scale(1.15)}}
@keyframes f3{0%,100%{transform:translate(0,0)}50%{transform:translate(-130px,90px)}}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:36px 36px;animation:bgShift 60s linear infinite}
@keyframes bgShift{from{background-position:0 0}to{background-position:72px 72px}}

#app{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:24px 18px 100px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.logo{display:flex;align-items:center;gap:14px}
.logo-icon{width:58px;height:58px;display:grid;place-items:center;font-size:30px;border-radius:20px;background:linear-gradient(145deg,rgba(255,209,102,.25),rgba(139,92,246,.25));border:1.5px solid rgba(255,209,102,.4);box-shadow:0 0 40px rgba(255,176,32,.25),inset 0 1px 0 rgba(255,255,255,.15);animation:pulseGlow 3.5s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 30px rgba(255,176,32,.2),inset 0 1px 0 rgba(255,255,255,.15)}50%{box-shadow:0 0 55px rgba(255,176,32,.5),inset 0 1px 0 rgba(255,255,255,.15)}}
.logo-title{font-size:24px;font-weight:900;letter-spacing:2.5px;line-height:1.1}
.logo-title span{background:linear-gradient(90deg,var(--gold),var(--gold2),#fff2c4,var(--gold2),var(--gold));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 5s linear infinite}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.logo-sub{font-size:11px;letter-spacing:2.6px;color:var(--muted);text-transform:uppercase;margin-top:4px}

.player-bar{display:flex;align-items:center;gap:12px;padding:10px 18px 10px 10px;border-radius:20px;background:var(--panel);border:1.5px solid var(--stroke);backdrop-filter:blur(20px);box-shadow:0 14px 40px rgba(0,0,0,.5);position:relative;overflow:hidden}
.player-bar::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent,rgba(255,209,102,.08),transparent);animation:slide 4s infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.mini-avatar{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:26px;background:linear-gradient(145deg,rgba(139,92,246,.4),rgba(96,165,250,.3));border:1.5px solid rgba(255,255,255,.18);overflow:hidden;flex-shrink:0;box-shadow:0 6px 18px rgba(139,92,246,.3)}
.mini-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.mini-name{font-weight:800;font-size:15px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-money{font-size:14px;font-weight:900;letter-spacing:.4px;background:linear-gradient(90deg,var(--gold),#ffe9a8,var(--gold2),var(--gold));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 4s ease infinite}
.save-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:savePulse 2s infinite;margin-left:6px;display:inline-block;vertical-align:middle}
@keyframes savePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}
.money-pop{position:fixed;right:24px;top:70px;font-weight:900;pointer-events:none;animation:moneyPop 1.8s ease forwards;font-size:18px;z-index:300;text-shadow:0 0 20px currentColor}
@keyframes moneyPop{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1;transform:translateY(-10px) scale(1.15)}100%{opacity:0;transform:translateY(-70px) scale(1)}}

.tabs{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.tab{padding:12px 22px;border-radius:16px;border:1.5px solid var(--stroke);cursor:pointer;background:var(--panel2);color:var(--muted);font-size:14px;font-weight:800;transition:.25s;backdrop-filter:blur(14px);font-family:inherit;position:relative;overflow:hidden}
.tab::before{content:'';position:absolute;inset:0;background:linear-gradient(140deg,rgba(255,255,255,.08),transparent 60%);opacity:0;transition:.25s}
.tab:hover{color:var(--txt);border-color:rgba(255,255,255,.24);transform:translateY(-2px)}
.tab:hover::before{opacity:1}
.tab.active{background:linear-gradient(135deg,rgba(255,209,102,.24),rgba(255,176,32,.12));color:var(--gold);border-color:rgba(255,209,102,.55);box-shadow:0 8px 28px rgba(255,176,32,.22),inset 0 1px 0 rgba(255,255,255,.15)}
.tab.active::after{content:'';position:absolute;left:50%;bottom:-8px;width:60%;height:3px;background:var(--gold);transform:translateX(-50%);border-radius:3px;box-shadow:0 0 16px var(--gold),0 0 28px rgba(255,209,102,.7)}

.btn{font-family:inherit;cursor:pointer;border:none;border-radius:14px;padding:12px 20px;font-size:14px;font-weight:800;transition:.22s;display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(140deg,rgba(255,255,255,.25),transparent 55%);opacity:0;transition:.28s;pointer-events:none}
.btn:hover::before{opacity:1}
.btn:active{transform:scale(.96)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#231a04;box-shadow:0 8px 26px rgba(255,176,32,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-gold:hover{box-shadow:0 14px 40px rgba(255,176,32,.6),inset 0 1px 0 rgba(255,255,255,.5);transform:translateY(-2px)}
.btn-ghost{background:rgba(255,255,255,.07);color:var(--txt);border:1.5px solid var(--stroke)}
.btn-ghost:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28)}
.btn-green{background:linear-gradient(135deg,#34d399,#059669);color:#022c1e;box-shadow:0 8px 26px rgba(52,211,153,.35)}
.btn-red{background:rgba(248,113,113,.16);color:var(--red);border:1.5px solid rgba(248,113,113,.4)}
.btn-red:hover{background:rgba(248,113,113,.28)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none}

.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.section-title{font-size:22px;font-weight:900;letter-spacing:.5px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.section-title small{color:var(--muted);font-weight:600;font-size:13px;letter-spacing:0}
.cat-badge{font-size:12px;font-weight:800;padding:6px 12px;border-radius:11px;background:linear-gradient(135deg,rgba(255,209,102,.2),rgba(255,176,32,.1));color:var(--gold);border:1.5px solid rgba(255,209,102,.4);letter-spacing:.3px}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 17px;border-radius:13px;font-size:13px;font-weight:800;cursor:pointer;background:rgba(255,255,255,.06);border:1.5px solid var(--stroke);color:var(--muted);transition:.2s;font-family:inherit}
.chip:hover{color:var(--txt);border-color:rgba(255,255,255,.24);transform:translateY(-1px)}
.chip.active{background:rgba(139,92,246,.28);border-color:rgba(139,92,246,.6);color:#d8ccff;box-shadow:0 6px 22px rgba(139,92,246,.3)}

.price-filter{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:16px 18px;background:var(--panel);border:1.5px solid var(--stroke);border-radius:20px;margin-bottom:20px;backdrop-filter:blur(18px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.pf-label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;flex-shrink:0}
.pf-inputs{display:flex;gap:8px;align-items:center;min-width:240px;flex:1}
.pf-inputs input{width:100%;min-width:80px;background:rgba(255,255,255,.07);border:1.5px solid var(--stroke);border-radius:12px;padding:10px 14px;color:var(--txt);font-family:inherit;font-size:14px;outline:none;transition:.22s;font-weight:800}
.pf-inputs input:focus{border-color:rgba(255,209,102,.6);background:rgba(255,255,255,.1);box-shadow:0 0 0 4px rgba(255,209,102,.12)}
.pf-dash{color:var(--muted);font-weight:800;flex-shrink:0}
.pf-presets{display:flex;gap:7px;flex-wrap:wrap}
.pf-preset{padding:7px 13px;border-radius:11px;font-size:12px;font-weight:800;background:rgba(255,255,255,.06);border:1.5px solid var(--stroke);color:var(--muted);cursor:pointer;transition:.18s;font-family:inherit;white-space:nowrap}
.pf-preset:hover{color:var(--txt);border-color:rgba(255,255,255,.24)}
.pf-preset.active{background:rgba(255,209,102,.2);border-color:rgba(255,209,102,.5);color:var(--gold);box-shadow:0 4px 14px rgba(255,209,102,.25)}
.pf-reset{padding:7px 13px;border-radius:11px;font-size:12px;font-weight:800;background:rgba(248,113,113,.12);border:1.5px solid rgba(248,113,113,.35);color:var(--red);cursor:pointer;transition:.18s;font-family:inherit;white-space:nowrap}
.pf-reset:hover{background:rgba(248,113,113,.24)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}

.card{background:var(--panel);border:1.5px solid var(--stroke);border-radius:24px;padding:20px;backdrop-filter:blur(18px);position:relative;transition:.35s cubic-bezier(.2,.8,.3,1);display:flex;flex-direction:column;gap:11px;isolation:isolate;animation:cardIn .5s ease backwards}
@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:none}}
.card::before{content:'';position:absolute;inset:0;border-radius:24px;padding:1.5px;background:linear-gradient(140deg,rgba(255,255,255,.28),transparent 45%,rgba(139,92,246,.15));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:1}
.card::after{content:'';position:absolute;inset:-3px;border-radius:26px;background:linear-gradient(140deg,rgba(255,209,102,.55),transparent 45%,rgba(139,92,246,.5));opacity:0;transition:.35s;z-index:-1;filter:blur(16px)}
.card:hover{transform:translateY(-8px) scale(1.02);border-color:rgba(255,255,255,.24);box-shadow:0 28px 65px rgba(0,0,0,.6)}
.card:hover::after{opacity:1}
.card-emoji{font-size:42px;line-height:1;filter:drop-shadow(0 6px 16px rgba(0,0,0,.6));position:relative;display:inline-block;width:fit-content;transition:transform .35s}
.card:hover .card-emoji{transform:scale(1.15) rotate(-5deg)}
.card-emoji::before{content:'';position:absolute;inset:-22px;border-radius:50%;background:radial-gradient(circle,rgba(255,209,102,.55),transparent 68%);opacity:0;transition:.4s;pointer-events:none;z-index:-1}
.card:hover .card-emoji::before{opacity:1}
.card-cat{position:absolute;top:16px;right:16px;font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);background:rgba(255,255,255,.08);padding:5px 10px;border-radius:9px;border:1.5px solid var(--stroke);z-index:2}
.card-cat[data-cat="Техника"]{background:rgba(96,165,250,.18);color:#93c5fd;border-color:rgba(96,165,250,.4)}
.card-cat[data-cat="Мебель"]{background:rgba(139,92,246,.18);color:#c4b5fd;border-color:rgba(139,92,246,.4)}
.card-cat[data-cat="Авто"]{background:rgba(248,113,113,.18);color:#fca5a5;border-color:rgba(248,113,113,.4)}
.card-cat[data-cat="Разное"]{background:rgba(255,209,102,.18);color:#fcd34d;border-color:rgba(255,209,102,.4)}
.card-cat[data-cat="Инструменты"]{background:rgba(52,211,153,.18);color:#6ee7b7;border-color:rgba(52,211,153,.4)}
.card-cat[data-cat="Спорт"]{background:rgba(251,146,60,.18);color:#fdba74;border-color:rgba(251,146,60,.4)}
.card-name{font-size:15px;font-weight:800;line-height:1.35}
.card-price{font-size:22px;font-weight:900;color:var(--gold);letter-spacing:.3px;text-shadow:0 2px 12px rgba(255,176,32,.25)}
.card-seller{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card-seller b{color:#c9d2e8;font-weight:800}
.tag{font-size:10.5px;padding:3px 8px;border-radius:8px;background:rgba(139,92,246,.24);color:#d8ccff;font-weight:800;border:1px solid rgba(139,92,246,.35)}
.card-actions{display:flex;gap:9px;margin-top:6px}
.card-actions .btn{flex:1;padding:11px 8px;font-size:13px;border-radius:13px}

.pagination{margin-top:28px;padding:20px;background:var(--panel);border:1.5px solid var(--stroke);border-radius:22px;backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.pg-info{text-align:center;font-size:13px;color:var(--muted);font-weight:700}
.pg-info b{color:var(--gold);font-weight:900}
.pg-controls{display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap}
.page-btn{min-width:42px;height:42px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.07);border:1.5px solid var(--stroke);color:var(--txt);font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;transition:.2s}
.page-btn:hover:not(:disabled):not(.active){background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);transform:translateY(-2px)}
.page-btn.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#231a04;border-color:var(--gold);box-shadow:0 6px 20px rgba(255,176,32,.5);cursor:default}
.page-btn:disabled{opacity:.35;cursor:not-allowed}
.page-btn.page-nav{font-size:13px;padding:0 15px;color:var(--gold);border-color:rgba(255,209,102,.45);background:rgba(255,209,102,.12)}
.page-btn.page-nav:hover:not(:disabled){background:rgba(255,209,102,.24);border-color:rgba(255,209,102,.6)}
.page-ellipsis{padding:0 8px;color:var(--muted);font-weight:800;line-height:42px}

.empty{text-align:center;padding:70px 24px;color:var(--muted);background:var(--panel);border:2px dashed var(--stroke);border-radius:26px}
.empty-ico{font-size:60px;margin-bottom:16px;opacity:.6}
.empty b{display:block;color:var(--txt);font-size:17px;margin-bottom:8px}

.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:20px;background:rgba(3,5,12,.78);backdrop-filter:blur(11px);opacity:0;transition:.28s;overflow-y:auto}
.overlay.show{opacity:1}
.modal{width:100%;max-width:540px;background:linear-gradient(165deg,rgba(30,35,58,.98),rgba(16,19,33,.99));border:1.5px solid rgba(255,255,255,.15);border-radius:28px;padding:26px;box-shadow:0 40px 100px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.1),0 0 100px rgba(139,92,246,.15);transform:scale(.92) translateY(15px);transition:.3s cubic-bezier(.2,.9,.3,1);max-height:92vh;display:flex;flex-direction:column;position:relative;margin:auto}
.overlay.show .modal{transform:scale(1) translateY(0)}

.modal-head{display:flex;align-items:center;gap:15px;margin-bottom:18px;flex-shrink:0}
.mh-avatar{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:linear-gradient(145deg,rgba(139,92,246,.4),rgba(96,165,250,.28));border:1.5px solid rgba(255,255,255,.18);flex-shrink:0;box-shadow:0 10px 30px rgba(139,92,246,.35),inset 0 1px 0 rgba(255,255,255,.15);overflow:hidden}
.mh-avatar img{width:100%;height:100%;object-fit:cover}
.mh-name{font-weight:900;font-size:17px}
.mh-sub{font-size:12px;color:var(--muted);margin-top:3px}
.close-x{margin-left:auto;background:rgba(255,255,255,.08);border:1.5px solid var(--stroke);color:var(--muted);width:38px;height:38px;border-radius:12px;cursor:pointer;font-size:17px;transition:.2s;flex-shrink:0;font-family:inherit}
.close-x:hover{background:rgba(248,113,113,.24);color:var(--red);border-color:rgba(248,113,113,.5)}

.trade-item{display:flex;align-items:center;gap:15px;padding:15px;border-radius:18px;background:rgba(255,255,255,.055);border:1.5px solid var(--stroke);margin-bottom:16px;flex-shrink:0}
.ti-emoji{font-size:38px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.ti-name{font-weight:900;font-size:15px}
.ti-price{font-size:13px;color:var(--gold);font-weight:800;margin-top:3px}

.chat{flex:1;min-height:200px;max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:8px 6px 12px;scroll-behavior:smooth}
.msg{display:flex;gap:11px;align-items:flex-end;animation:msgIn .35s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.msg.me{flex-direction:row-reverse}
.msg-av{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.09);flex-shrink:0;border:1.5px solid var(--stroke);overflow:hidden}
.msg-av img{width:100%;height:100%;object-fit:cover}
.msg-bubble{padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.5;max-width:78%;word-wrap:break-word;white-space:pre-wrap}
.msg.npc .msg-bubble{background:rgba(255,255,255,.085);border:1.5px solid var(--stroke);border-bottom-left-radius:6px}
.msg.me .msg-bubble{background:linear-gradient(135deg,rgba(255,209,102,.95),rgba(255,176,32,.95));color:#241a04;font-weight:700;border-bottom-right-radius:6px;box-shadow:0 6px 18px rgba(255,176,32,.25)}
.msg-sys{align-self:center;font-size:12px;color:var(--muted);background:rgba(255,255,255,.06);padding:7px 16px;border-radius:22px;border:1.5px solid var(--stroke);text-align:center;max-width:90%;font-weight:700}
.msg-sys.ok{color:var(--green);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.12)}
.msg-sys.bad{color:var(--red);border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.12)}

.typing-bubble{padding:16px 20px;display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.085);border:1.5px solid var(--stroke);border-radius:18px;border-bottom-left-radius:6px;min-height:24px}
.typing-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.7);animation:typingBounce 1.2s infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-9px);opacity:1}}

.chat-quick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px;flex-shrink:0;transition:opacity .2s}
.chat-quick.locked{opacity:.35;pointer-events:none}
.qbtn{font-family:inherit;font-size:12.5px;font-weight:800;padding:9px 15px;border-radius:11px;background:rgba(139,92,246,.2);border:1.5px solid rgba(139,92,246,.4);color:#d8ccff;cursor:pointer;transition:.2s}
.qbtn:hover{background:rgba(139,92,246,.36);transform:translateY(-2px);box-shadow:0 6px 18px rgba(139,92,246,.35)}

.chat-input{display:flex;gap:10px;flex-shrink:0}
.chat-input input{flex:1;background:rgba(255,255,255,.07);border:1.5px solid var(--stroke);border-radius:15px;padding:14px 18px;color:var(--txt);font-size:14px;font-family:inherit;outline:none;transition:.22s}
.chat-input input:focus{border-color:rgba(255,209,102,.6);background:rgba(255,255,255,.1);box-shadow:0 0 0 4px rgba(255,209,102,.12)}
.chat-input input:disabled{opacity:.5;cursor:not-allowed}

input[type="range"].price-slider{width:100%;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--violet),var(--gold),var(--orange),var(--red));outline:none;-webkit-appearance:none;appearance:none;cursor:pointer;box-shadow:inset 0 2px 6px rgba(0,0,0,.4)}
input[type="range"].price-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;border-radius:50%;background:linear-gradient(145deg,var(--gold),var(--gold2));border:3px solid #1a1e30;cursor:pointer;box-shadow:0 6px 16px rgba(255,176,32,.65),inset 0 1px 0 rgba(255,255,255,.5);transition:.15s}

/* ===== УПАКОВКА ===== */
.pack-stage{position:relative;height:200px;display:flex;align-items:center;justify-content:center;margin:18px 0;background:radial-gradient(circle at 50% 50%,rgba(139,92,246,.15),rgba(255,255,255,.02));border-radius:22px;border:2px dashed var(--stroke);overflow:hidden}

.pack-box-anim{font-size:90px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.6));animation:boxIn .6s cubic-bezier(.3,1.5,.5,1) forwards}

.pack-box-anim.taped{animation:tapeAnim .5s ease}

.tape-strip{position:absolute;width:70%;height:26px;top:50%;left:15%;transform:translateY(-50%);background:repeating-linear-gradient(90deg,rgba(200,210,220,.85) 0 20px,rgba(220,230,240,.95) 20px 40px);border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.4);animation:tapeSlide .5s ease forwards;transform-origin:left center;z-index:2}

.pack-info{text-align:center;padding:12px;background:rgba(255,255,255,.05);border-radius:14px;border:1.5px solid var(--stroke);margin-bottom:16px}

/* ===== ПРОФИЛЬ ===== */

.profile-card{background:var(--panel);border:1.5px solid var(--stroke);border-radius:26px;padding:28px;backdrop-filter:blur(18px);text-align:center;position:relative;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.4)}

/* ===== НАСТРОЙКИ ===== */
.settings-grid{display:grid;grid-template-columns:1fr;gap:20px;max-width:820px;margin:0 auto}

.avatar-upload{display:flex;gap:18px;align-items:center;flex-wrap:wrap}

.upload-actions .btn{margin-bottom:10px}

/* ===== ЦВЕТА НИКА ===== */
.color-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.color-card{padding:13px;border-radius:14px;background:rgba(255,255,255,.05);border:2px solid var(--stroke);cursor:pointer;transition:.22s;text-align:center;font-family:inherit;position:relative;overflow:hidden}
.color-card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.28)}
.color-card.owned{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.08)}
.color-card.active{border-color:var(--gold);background:rgba(255,209,102,.14);box-shadow:0 6px 22px rgba(255,209,102,.28)}
.color-name{font-size:13px;font-weight:900;margin-bottom:6px}
.color-price{font-size:11.5px;font-weight:800;color:var(--gold)}
.color-card.owned .color-price{color:var(--green)}
.color-card.owned .color-price::before{content:'✓ '}
.color-check{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#231a04;display:grid;place-items:center;font-size:12px;font-weight:900;opacity:0;transition:.2s}

/* ===== СПИСКИ ===== */
.listing{display:flex;align-items:center;gap:16px;padding:18px;border-radius:22px;background:var(--panel);border:1.5px solid var(--stroke);backdrop-filter:blur(16px);margin-bottom:13px;transition:.25s;flex-wrap:wrap;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.listing:hover{border-color:rgba(255,255,255,.22);box-shadow:0 16px 40px rgba(0,0,0,.4);transform:translateY(-2px)}
.l-emoji{font-size:36px;flex-shrink:0;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.l-body{flex:1;min-width:160px}
.l-name{font-weight:900;font-size:15px}
.l-meta{font-size:13px;color:var(--muted);margin-top:4px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.l-price{font-weight:900;color:var(--gold);font-size:16px}
.l-timer{font-size:13px;font-weight:900;color:var(--blue);background:rgba(96,165,250,.14);border:1.5px solid rgba(96,165,250,.35);padding:7px 14px;border-radius:11px;white-space:nowrap}
.l-timer.warn{color:var(--red);background:rgba(248,113,113,.14);border-color:rgba(248,113,113,.4);animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}

#toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:11px;max-width:360px}
.toast{background:linear-gradient(160deg,rgba(32,38,62,.99),rgba(18,22,38,.99));border:1.5px solid rgba(255,255,255,.18);border-radius:18px;padding:16px 18px;box-shadow:0 20px 55px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.1);font-size:13.5px;line-height:1.5;animation:toastIn .38s cubic-bezier(.2,.9,.3,1);display:flex;gap:14px;align-items:flex-start}
@keyframes toastIn{from{opacity:0;transform:translateX(50px) scale(.9)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .35s forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(50px) scale(.9)}}
.toast-ico{font-size:22px;flex-shrink:0}
.toast-body{flex:1}
.toast-title{font-weight:900;margin-bottom:4px;font-size:14px}

@media(max-width:600px){
  #app{padding:16px 12px 85px}
  .logo-title{font-size:17px}

  .card{padding:14px;border-radius:18px}

  .avatar-grid{grid-template-columns:repeat(5,1fr)}
  .price-filter{flex-direction:column;align-items:stretch}
  .pf-inputs{min-width:0}
  .page-btn{min-width:36px;height:36px;font-size:13px}

  .pack-steps{flex-direction:column}
  .pack-stage{height:160px}

  .pack-box-anim{font-size:72px}
  .big-avatar{width:100px;height:100px;font-size:48px}
}
</style>

<body>
<div class="bg">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<div id="app">
  <header class="topbar">
    <div class="logo">
      <div class="logo-icon">💸</div>
      <div>
        <div class="logo-title">ПЕРЕКУП<span>PRO</span></div>
        <div class="logo-sub">торгуйся · покупай · продавай</div>
      </div>
    </div>
    <div class="player-bar" id="playerBar"></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>

<div id="modal-root"></div>
<div id="toasts"></div>

<script>
/* ===== УТИЛИТЫ ===== */
const $ = (s, r = document) => r.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const round100 = n => Math.max(100, Math.round(n / 100) * 100);
const fmt = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTime = m => { m = Math.max(0, Math.round(m)); const h = Math.floor(m / 60), mm = m % 60; return h <= 0 ? mm + ' мин' : h + ' ч ' + (mm ? mm + ' м' : ''); };
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ===== ЗВУКИ ===== */
const Sound = {
  ctx: null,
  enabled: true,
  init() { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} },
  ensure() {
    if (!this.ctx) this.init();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    return this.ctx;
  },
  tone(freq, duration, type = 'sine', vol = 0.15, delay = 0) {
    if (!this.enabled) return;
    const ctx = this.ensure();
    if (!ctx) return;
    try {
      const now = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + duration);
    } catch (e) {}
  },
  sweep(f1, f2, duration, type = 'sine', vol = 0.15) {
    if (!this.enabled) return;
    const ctx = this.ensure();
    if (!ctx) return;
    try {
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f1, now);
      osc.frequency.exponentialRampToValueAtTime(f2, now + duration);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + duration);
    } catch (e) {}
  },
  playBuyer() { this.tone(880, 0.22, 'sine', 0.22); this.tone(1320, 0.32, 'sine', 0.16, 0.16); this.tone(1760, 0.42, 'sine', 0.11, 0.32); },
  playPack() { this.sweep(300, 120, 0.2, 'triangle', 0.22); this.tone(600, 0.08, 'square', 0.05); },
  playTape() { this.tone(1600, 0.06, 'square', 0.09); this.tone(1400, 0.08, 'square', 0.07, 0.08); this.tone(1200, 0.09, 'square', 0.06, 0.16); },
  playSend() { this.sweep(350, 1400, 0.45, 'sawtooth', 0.11); },
  playSuccess() { this.tone(1047, 0.16, 'sine', 0.18); this.tone(1319, 0.16, 'sine', 0.18, 0.12); this.tone(1568, 0.35, 'sine', 0.22, 0.24); this.tone(2093, 0.5, 'sine', 0.12, 0.4); },
  playCoin() { this.tone(1800, 0.08, 'sine', 0.15); this.tone(2400, 0.12, 'sine', 0.12, 0.06); },
};

/* ===== ТЕМЫ ===== */
const THEMES = {
  space:   { name: 'Космос', bg: '#070912', b1: '#6d28d9', b2: '#0e7490', b3: '#b45309' },
  ocean:   { name: 'Океан',  bg: '#04141f', b1: '#0891b2', b2: '#0369a1', b3: '#06b6d4' },
  sunset:  { name: 'Закат',  bg: '#1a0d05', b1: '#ea580c', b2: '#dc2626', b3: '#f59e0b' },
  forest:  { name: 'Лес',    bg: '#05140d', b1: '#059669', b2: '#16a34a', b3: '#84cc16' },
  cyber:   { name: 'Кибер',  bg: '#0a0514', b1: '#ec4899', b2: '#a855f7', b3: '#06b6d4' },
  midnight:{ name: 'Полночь',bg: '#08080a', b1: '#334155', b2: '#475569', b3: '#1e293b' },
};

function applyTheme(key) {
  const t = THEMES[key] || THEMES.space;
  document.documentElement.style.setProperty('--bg', t.bg);
  document.documentElement.style.setProperty('--blob1', t.b1);
  document.documentElement.style.setProperty('--blob2', t.b2);
  document.documentElement.style.setProperty('--blob3', t.b3);
  document.body.style.background = t.bg;
}

/* ===== ЦВЕТА НИКА ===== */
const NICK_COLORS = [
  { id: 'default', name: 'Стандарт', color: '#eef1fb', price: 0 },
  { id: 'gold', name: 'Золотой', color: '#ffd166', price: 1000 },
  { id: 'red', name: 'Алый', color: '#f87171', price: 1500 },
  { id: 'green', name: 'Изумруд', color: '#34d399', price: 1500 },
  { id: 'blue', name: 'Сапфир', color: '#60a5fa', price: 1500 },
  { id: 'violet', name: 'Аметист', color: '#c4b5fd', price: 2000 },
  { id: 'pink', name: 'Розовый', color: '#f472b6', price: 2000 },
  { id: 'orange', name: 'Огненный', color: '#fb923c', price: 2500 },
  { id: 'rainbow', name: 'Радужный', color: 'rainbow', price: 5000 },
];

function nickStyle(colorId) {
  const c = NICK_COLORS.find(x => x.id === colorId) || NICK_COLORS[0];
  if (c.id === 'rainbow') return 'background:linear-gradient(90deg,#f87171,#fbbf24,#34d399,#60a5fa,#c4b5fd,#f472b6);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 3s linear infinite;font-weight:900';
  return `color:${c.color}`;
}

/* ===== СОХРАНЕНИЕ ===== */
function saveGame() {
  state.saving = true;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: SAVE_VERSION, ts: Date.now(),
      player: state.player, inventory: state.inventory, listings: state.listings,
      market: state.market, gameMin: state.gameMin, stats: state.stats, uid: state.uid,
      theme: state.theme, soundOn: state.soundOn,
    }));
    state.lastSaveOk = true;
  } catch (e) { state.lastSaveOk = false; }
  setTimeout(() => { state.saving = false; }, 800);
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (d.v !== SAVE_VERSION) { localStorage.removeItem(SAVE_KEY); return false; }
    state.player = d.player || state.player;
    if (state.player.avatarImage === undefined) state.player.avatarImage = null;
    if (!state.player.nickColors) state.player.nickColors = ['default'];
    if (!state.player.nickColor) state.player.nickColor = 'default';
    state.inventory = d.inventory || [];
    state.listings = d.listings || [];
    state.market = d.market || [];
    state.stats = d.stats || { bought: 0, sold: 0, profit: 0 };
    state.uid = d.uid || 1;
    state.gameMin = d.gameMin || 0;
    state.theme = d.theme || 'space';
    state.soundOn = d.soundOn !== false;
    Sound.enabled = state.soundOn;
    return true;
  } catch (e) { return false; }
}

function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

/* ===== ГЕНЕРАЦИЯ РЫНКА ===== */
function genMarketItem(maxValue) {
  const cutoff = maxValue || Math.max(30000, state.player.money * 2.5);
  let pool = CATALOG.filter(c => c.v <= cutoff);
  if (!pool.length) pool = CATALOG.filter(c => c.v <= cutoff * 3);
  if (!pool.length) pool = CATALOG;
  const base = pick(pool);
  const value = round100(base.v * rnd(0.85, 1.15));
  const trait = pick(NPC_TRAITS);
  const askPrice = round100(value * rnd(1.08, 1.36));
  const minPrice = round100(value * rnd(0.76, 0.94) * trait.greed * 0.95);
  return {
    uid: state.uid++, name: base.n, emoji: base.e, cat: base.c, value, askPrice,
    minPrice: Math.min(minPrice, Math.round(askPrice * 0.93)),
    npc: {
      name: pick(NPC_NAMES), avatar: pick(NPC_AVATARS), trait: trait.t,
      greed: trait.greed, stubborn: trait.stubborn,
      patience: trait.patience, maxPatience: trait.patience,
    },
  };
}

function refillMarket() {
  const wealth = state.player.money;
  while (state.market.length < MARKET_TARGET) {
    const r = Math.random();
    let maxV;
    if (r < 0.30) maxV = Math.max(2000, wealth * 0.8);
    else if (r < 0.60) maxV = Math.max(15000, wealth * 2);
    else if (r < 0.85) maxV = Math.max(50000, wealth * 5);
    else maxV = Math.max(200000, wealth * 15);
    state.market.push(genMarketItem(maxV));
  }
  let affordable = state.market.filter(i => i.askPrice <= wealth).length;
  if (affordable < 3) {
    for (let i = state.market.length - 1; i >= 0 && affordable < 3; i--) {
      if (state.market[i].askPrice > wealth) {
        const cheap = genMarketItem(Math.max(1500, Math.floor(wealth * 0.7)));
        cheap.askPrice = Math.min(cheap.askPrice, Math.round(wealth * 0.88));
        cheap.minPrice = Math.min(cheap.minPrice, Math.round(cheap.askPrice * 0.85));
        state.market[i] = cheap;
        affordable++;
      }
    }
  }
}

function rankOf() {
  const m = state.player.money;
  if (m < 300000) return 'Любитель';
  if (m < 800000) return 'Перекуп';
  if (m < 2000000) return 'Барыга со стажем';
  if (m < 6000000) return 'Акула рынка';
  if (m < 15000000) return 'Магнат барахолки';
  return 'Легенда перекупа';
}

function avatarHtml(size = 50, radius = 15) {
  if (state.player.avatarImage) {
    return `<div class="mini-avatar" style="width:${size}px;height:${size}px;border-radius:${radius}px"><img src="${state.player.avatarImage}" alt=""></div>`;
  }
  return `<div class="mini-avatar" style="width:${size}px;height:${size}px;border-radius:${radius}px;font-size:${Math.round(size*0.5)}px">${state.player.avatar}</div>`;
}

function renderPlayerBar() {
  const ns = nickStyle(state.player.nickColor);
  $('#playerBar').innerHTML = `${avatarHtml(50, 15)}
    <div><div class="mini-name" style="${ns}">${esc(state.player.name)}<span class="save-dot" title="Автосохранение"></span></div>
    <div class="mini-money" id="moneyLabel">${fmt(state.player.money)}</div></div>`;
}

function popMoney(amount, positive = true) {
  const pop = document.createElement('div');
  pop.className = 'money-pop';
  pop.style.color = positive ? 'var(--green)' : 'var(--red)';
  pop.textContent = (positive ? '+' : '−') + fmt(amount);
  document.body.appendChild(pop);
  setTimeout(() => pop.remove(), 1800);
  if (positive) Sound.playCoin();
}

function renderTabs() {
  const tabs = [
    ['market','🏷️ Рынок'],['inventory','📦 Склад'],['listings','📢 Объявления'],
    ['profile','👤 Профиль'],['settings','⚙️ Настройки']

  $('#tabs').innerHTML = tabs.map(([id, l]) =>
    `<button class="tab ${state.tab === id ? 'active' : ''}" onclick="setTab('${id}')">${l}</button>`
  ).join('');
}

function setTab(t) { state.tab = t; renderTabs(); renderView(); saveGame(); }

function renderView() {
  renderPlayerBar();
  const v = $('#view');
  switch (state.tab) {
    case 'market': v.innerHTML = marketHTML(); break;
    case 'inventory': v.innerHTML = inventoryHTML(); break;
    case 'listings': v.innerHTML = listingsHTML(); break;
    case 'profile': v.innerHTML = profileHTML(); break;
    case 'settings': v.innerHTML = settingsHTML(); break;
  }
  updateTimers();
}

/* ===== РЫНОК ===== */
function getFilteredMarket() {
  let items = state.market.filter(i => state.filter === 'Все' || i.cat === state.filter);
  items = items.filter(i => i.askPrice >= state.priceMin && i.askPrice <= state.priceMax);
  return items;
}

function marketHTML() {
  const cats = ['Все', 'Техника', 'Мебель', 'Авто', 'Разное', 'Инструменты', 'Спорт'];
  const allItems = getFilteredMarket();
  const total = allItems.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (state.page > totalPages) state.page = totalPages;
  if (state.page < 1) state.page = 1;
  const start = (state.page - 1) * PAGE_SIZE;
  const pageItems = allItems.slice(start, start + PAGE_SIZE);

  const cards = pageItems.map((i, idx) => `
    <div class="card" style="animation-delay:${idx * 30}ms">
      <div class="card-cat" data-cat="${i.cat}">${i.cat}</div>
      <div class="card-emoji">${i.emoji}</div>
      <div class="card-name">${esc(i.name)}</div>
      <div class="card-price">${fmt(i.askPrice)}</div>
      <div class="card-seller">
        <span>${i.npc.avatar}</span><b>${i.npc.name}</b>
        <span class="tag">${i.npc.trait}</span>
      </div>
      <div class="card-actions">
        <button class="btn btn-gold" onclick="openTrade(${i.uid})">💬 Торг</button>
        <button class="btn btn-ghost" onclick="buyNow(${i.uid})">Купить</button>
      </div>
    </div>`).join('');

  const presets = [
    ['all','Все','0','99999999'],['cheap','до 5к','0','5000'],
    ['mid','5–30к','5000','30000'],['high','30–150к','30000','150000'],
    ['premium','150к+','150000','99999999'],
  ];
  const presetHtml = presets.map(([k, l, mn, mx]) =>
    `<button class="pf-preset ${state.pricePreset === k ? 'active' : ''}" onclick="setPricePreset('${k}',${mn},${mx})">${l}</button>`
  ).join('');

  const gridHtml = pageItems.length
    ? `<div class="grid">${cards}</div>`
    : `<div class="empty"><div class="empty-ico">🔍</div><b>Ничего не найдено</b>Попробуй изменить фильтры</div>`;

  const paginationHtml = total > 0 ? `
    <div class="pagination">
      <div class="pg-info">Показано <b>${Math.min(start + 1, total)}–${Math.min(start + PAGE_SIZE, total)}</b> из <b>${total}</b> · Страница <b>${state.page}</b> из <b>${totalPages}</b></div>
      <div class="pg-controls">
        <button class="page-btn page-nav" onclick="goPage(${state.page - 1})" ${state.page <= 1 ? 'disabled' : ''}>‹ Назад</button>
        ${renderPageButtons(state.page, totalPages)}
        <button class="page-btn page-nav" onclick="goPage(${state.page + 1})" ${state.page >= totalPages ? 'disabled' : ''}>Вперёд ›</button>
      </div>
    </div>` : '';

  return `
    <div class="section-head">
      <div class="section-title">Рынок <span class="cat-badge">📚 ${CATALOG_SIZE.toLocaleString('ru-RU')} товаров</span></div>
      <div class="filters">
        ${cats.map(c => `<button class="chip ${state.filter === c ? 'active' : ''}" onclick="setFilter('${c}')">${c}</button>`).join('')}
      </div>
    </div>
    <div class="price-filter">
      <span class="pf-label">Цена</span>
      <div class="pf-inputs">
        <input type="number" id="priceMinInput" value="${state.priceMin === 0 ? '' : state.priceMin}" placeholder="от" min="0" step="100" oninput="onPriceMinInput(this.value)">
        <span class="pf-dash">—</span>
        <input type="number" id="priceMaxInput" value="${state.priceMax >= 99999999 ? '' : state.priceMax}" placeholder="до" min="0" step="100" oninput="onPriceMaxInput(this.value)">
      </div>
      <div class="pf-presets">${presetHtml}</div>
      <button class="pf-reset" onclick="resetPriceFilter()">✕ Сброс</button>
    </div>
    ${gridHtml}
    ${paginationHtml}`;
}

function renderPageButtons(current, total) {
  if (total <= 1) return '';
  const pages = [];
  if (total <= 7) { for (let i = 1; i <= total; i++) pages.push(i); }
  else {
    pages.push(1);
    if (current > 3) pages.push('...');
    for (let i = Math.max(2, current - 1); i <= Math.min(total - 1, current + 1); i++) pages.push(i);
    if (current < total - 2) pages.push('...');
    pages.push(total);
  }
  return pages.map(p => p === '...' ? '<span class="page-ellipsis">…</span>'
    : `<button class="page-btn ${p === current ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`).join('');
}

function goPage(p) {
  const total = Math.max(1, Math.ceil(getFilteredMarket().length / PAGE_SIZE));
  state.page = clamp(p, 1, total);
  renderView();
  const top = document.querySelector('.section-head');
  if (top) window.scrollTo({ top: top.offsetTop - 20, behavior: 'smooth' });
}

function setFilter(c) { state.filter = c; state.page = 1; renderView(); }

let priceDebounce = null;
function onPriceMinInput(v) {
  state.priceMin = Math.max(0, +v || 0);
  state.pricePreset = 'custom'; state.page = 1;
  if (state.priceMax < state.priceMin) { state.priceMax = state.priceMin; const mx = document.getElementById('priceMaxInput'); if (mx) mx.value = state.priceMax; }
  clearTimeout(priceDebounce);
  priceDebounce = setTimeout(() => { renderView(); if ($('#priceMinInput')) $('#priceMinInput').focus(); }, 350);
}
function onPriceMaxInput(v) {
  state.priceMax = v === '' ? 99999999 : Math.max(0, +v || 0);
  state.pricePreset = 'custom'; state.page = 1;
  if (state.priceMax < state.priceMin) { state.priceMin = 0; const mn = document.getElementById('priceMinInput'); if (mn) mn.value = ''; }
  clearTimeout(priceDebounce);
  priceDebounce = setTimeout(() => { renderView(); if ($('#priceMaxInput')) $('#priceMaxInput').focus(); }, 350);
}
function setPricePreset(k, mn, mx) { state.pricePreset = k; state.priceMin = mn; state.priceMax = mx; state.page = 1; renderView(); }
function resetPriceFilter() { state.pricePreset = 'all'; state.priceMin = 0; state.priceMax = 99999999; state.page = 1; renderView(); }

function buyNow(uid) {
  const it = state.market.find(i => i.uid === uid);
  if (!it) return;
  if (state.player.money < it.askPrice) return toast('💸 Недостаточно денег', 'Нужно ' + fmt(it.askPrice));
  state.player.money -= it.askPrice;
  addToInventory(it, it.askPrice);
  state.market = state.market.filter(i => i.uid !== uid);
  refillMarket(); state.stats.bought++;
  toast('📦 Куплено', `${it.name} за ${fmt(it.askPrice)}`);
  renderView(); popMoney(it.askPrice, false); saveGame();
}

function addToInventory(m, buyPrice) {
  state.inventory.push({
    uid: state.uid++, name: m.name, emoji: m.emoji, cat: m.cat,
    value: m.value, buyPrice,
  });
}

function listingsHTML() {
  if (!state.listings.length) return `<div class="section-head"><div class="section-title">Мои объявления</div></div>
    <div class="empty"><div class="empty-ico">📢</div><b>Нет активных объявлений</b>Выстави товар со склада — и жди покупателя</div>`;
  const rows = state.listings.map(L => {
    const ratio = L.price / L.item.value;
    const chance = ratio <= 0.9 ? '🔥 Горячая цена' : ratio <= 1.05 ? '✅ Хорошая цена' : ratio <= 1.2 ? '🕐 Дороговато' : '🧊 Слишком дорого';
    const warn = L.timeLeft < L.total * 0.25;
    return `<div class="listing">
      <div class="l-emoji">${L.item.emoji}</div>
      <div class="l-body"><div class="l-name">${esc(L.item.name)}</div>
        <div class="l-meta"><span class="l-price">${fmt(L.price)}</span><span>${chance}</span></div>
      </div>
      <div class="l-timer ${warn ? 'warn' : ''}" data-tl="${L.uid}">${fmtTime(L.timeLeft)}</div>
      <button class="btn btn-ghost" onclick="cancelListing(${L.uid})">Снять</button>
    </div>`;
  }).join('');
  return `<div class="section-head"><div class="section-title">Мои объявления <small>${state.listings.length} активных</small></div></div>${rows}`;
}

function updateTimers() {
  document.querySelectorAll('[data-tl]').forEach(e => {
    const uid = +e.dataset.tl;
    const L = state.listings.find(l => l.uid === uid);
    if (!L) return;
    e.textContent = fmtTime(L.timeLeft);
    e.classList.toggle('warn', L.timeLeft < L.total * 0.25);
  });
}

function cancelListing(uid) {
  const L = state.listings.find(l => l.uid === uid);
  if (!L) return;
  state.listings = state.listings.filter(l => l.uid !== uid);
  state.inventory.push(L.item);
  closeModal();
  toast('↩️ Объявление снято', L.item.name + ' вернулся на склад');
  renderView(); saveGame();
}

function buyNickColor(id) {

/* ===== АВАТАРКА ===== */
function uploadAvatar(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) return toast('⚠️ Файл слишком большой', 'Максимум 5MB');
  if (!file.type.startsWith('image/')) return toast('⚠️ Не картинка', 'Выберите изображение');
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const compressed = await compressImage(e.target.result, 160, 0.82);
      state.player.avatarImage = compressed;
      renderPlayerBar(); renderView(); saveGame();
      toast('✅ Аватарка загружена', 'Сохранено автоматически');
    } catch (err) {
      toast('⚠️ Ошибка', 'Не удалось обработать изображение');
    }
  };
  reader.readAsDataURL(file);
}

function compressImage(dataUrl, maxSize, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        const scale = Math.min(maxSize / img.width, maxSize / img.height, 1);
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      } catch (e) { reject(e); }
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

  toast('🗑️ Фото удалено', 'Вернулся emoji-аватар');
