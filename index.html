function newGame() {
  state.player = {
    name: 'Новичок', avatar: '🧑‍💼', avatarImage: null, money: START_MONEY,
    nickColor: 'default', nickColors: ['default'],
  };
  state.inventory = []; state.listings = []; state.market = [];
  state.stats = { bought: 0, sold: 0, profit: 0 };
  state.uid = 1; state.gameMin = 0; state.page = 1;
  state.filter = 'Все'; state.priceMin = 0; state.priceMax = 99999999; state.pricePreset = 'all';
  state.theme = 'space'; state.soundOn = true;
  Sound.enabled = true;
  applyTheme('space');
  for (let i = 0; i < 3; i++) {
    const cheap = CATALOG.filter(c => c.v <= 5000);
    const b = pick(cheap);
    const val = round100(b.v);
    state.inventory.push({
      uid: state.uid++, name: b.n, emoji: b.e, cat: b.c,
      value: val, buyPrice: round100(val * 0.5),
    });
  }
  refillMarket(); saveGame();
}

/* ===== МОДАЛКИ ===== */
function showModal(html, wide) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="overlay" id="overlay"><div class="modal" style="${wide ? 'max-width:660px' : ''}">${html}</div></div>`;
  requestAnimationFrame(() => { const o = $('#overlay'); if (o) o.classList.add('show'); });
}
function closeModal() {
  const o = $('#overlay');
  if (!o) return;
  o.classList.remove('show');
  setTimeout(() => { if (!$('#overlay') || !$('#overlay').classList.contains('show')) $('#modal-root').innerHTML = ''; }, 280);
}

/* ===== ПАРСИНГ ЧИСЕЛ ===== */
function extractNumber(text) {
  const t = text.toLowerCase().replace(/\s+/g, '');
  if (/\d+\s*%/.test(text)) return null;
  if (/полтос|полтинник/.test(t)) return 50000;
  if (/сотка|сотня/.test(t) && !/\d/.test(t)) return 100000;
  if (/двушка|двушку/.test(t)) return 200000;
  if (/пятнашка|пятнашку/.test(t)) return 150000;
  if (/лимон|лям|мульт/.test(t)) {
    const m = t.match(/(\d+(?:[.,]\d+)?)(?:лимон|лям|мульт)/);
    if (m) return Math.round(parseFloat(m[1].replace(',', '.')) * 1000000);
    return 1000000;
  }
  const m = t.match(/(\d+(?:[.,]\d+)?)(кк|к|k|тыс|тысяч|тыщи|млн)?/);
  if (!m) return null;
  let n = parseFloat(m[1].replace(',', '.'));
  if (isNaN(n)) return null;
  const suf = m[2];
  if (suf === 'к' || suf === 'кк' || suf === 'k' || suf === 'тыс' || suf === 'тысяч' || suf === 'тыщи') n *= 1000;
  else if (suf === 'млн') n *= 1000000;
  return Math.round(n);
}

function detectIntents(text) {
  const t = text.toLowerCase();
  const r = [];
  if (/(скидк|дешев|торг|уступ|сбав|сниз|подешев)/.test(t)) r.push('ask_discount');
  if (/(дорого|дороговат|слишком|перебор|грабёж|грабеж|обдирал)/.test(t)) r.push('too_expensive');
  if (/(состоян|дефект|царап|провер|осмотр|работает|исправн)/.test(t)) r.push('ask_condition');
  if (/(привет|здравств|добр|хай|салют|дороу)/.test(t)) r.push('greeting');
  if (/(беру|забираю|согласен|договорил|по рукам|идёт|идет)/.test(t) && !/\d/.test(text)) r.push('accept');
  if (/(доставк|самовывоз|курьер|привез|привезти|отправ)/.test(t)) r.push('ask_delivery');
  if (/(срочн|сегодня|сейчас|быстр|побыстрей|заберу)/.test(t)) r.push('urgency');
  if (/(назови|скажи|какая|какую|сколько стоит|почём|почем|назовите)/.test(t)) r.push('ask_price');
  if (/(спасибо|благодар|пожалуйста|извините)/.test(t)) r.push('polite');
  if (/(обман|кидал|развод|подвох|проверк|довер)/.test(t)) r.push('distrust');
  if (/(комплект|коробк|документ|чек|гарантийн|упаковк)/.test(t)) r.push('ask_accessories');
  if (/(причин|почему прода|зачем прода)/.test(t)) r.push('ask_reason');
  if (/(как давно|когда куп|сколько польз)/.test(t)) r.push('ask_age');
  if (/(торг уместен|поторг|возможен торг|подвинут|уступ)/.test(t)) r.push('ask_negotiable');
  if (/(фото|фотк|покажи|скинь фото)/.test(t)) r.push('ask_photos');
  if (/(трейд|обмен|поменя|в зачёт|зачет)/.test(t)) r.push('ask_trade');
  if (/(где|адрес|встрет|метро|район)/.test(t)) r.push('ask_location');
  if (/(карт|нал|перевод|сбп|оплат)/.test(t)) r.push('ask_payment');
  if (/(круто|класс|отличн|хорош|нрав|прекрасн|мило)/.test(t)) r.push('complement');
  if (/(дурак|тупой|идиот|лох|развод|обманщик)/.test(t)) r.push('insult');
  return r;
}

/* ===== ТОРГ С ПРОДАВЦОМ ===== */
let tradeChat = null;

function openTrade(uid) {
  const item = state.market.find(i => i.uid === uid);
  if (!item) return;
  tradeChat = {
    item, messages: [], done: false, typing: false, turns: 0,
    lastOffer: null, repeats: 0, discussed: new Set(),
    refusals: 0, lowballsCount: 0, mood: 'neutral'
  };
  const it = item;
  npcSay(pick([
    `Здравствуйте! Продаю ${it.name} за ${fmt(it.askPrice)}. Торг уместен.`,
    `Приветствую. ${it.name}, состояние отличное. Прошу ${fmt(it.askPrice)}.`,
    `Добрый день! ${it.name} в продаже. Цена — ${fmt(it.askPrice)}.`,
    `Привет! ${it.name}, ${pick(REASONS[it.cat])}. Хочу ${fmt(it.askPrice)}.`,
  ]));
  renderTradeModal();
}

function npcSay(t) { tradeChat.messages.push({ who: 'npc', text: t }); }
function meSay(t) { tradeChat.messages.push({ who: 'me', text: t }); }
function sysSay(t, c) { tradeChat.messages.push({ who: 'sys', text: t, cls: c }); }

function renderTradeModal() {
  const it = tradeChat.item;
  showModal(`
    <div class="modal-head">
      <div class="mh-avatar">${it.npc.avatar}</div>
      <div><div class="mh-name">${it.npc.name}</div>
        <div class="mh-sub">${it.npc.trait} · терпение ${Math.max(0, Math.round(it.npc.patience))}%</div></div>
      <button class="close-x" onclick="closeModal()">✕</button>
    </div>
    <div class="trade-item">
      <div class="ti-emoji">${it.emoji}</div>
      <div><div class="ti-name">${esc(it.name)}</div>
        <div class="ti-price">Запрос: ${fmt(it.askPrice)}</div></div>
    </div>
    <div class="chat" id="chatBox"></div>
    <div class="chat-quick" id="quickBtns"></div>
    <div class="chat-input">
      <input id="chatField" placeholder="Напиши цену или вопрос..." onkeydown="if(event.key==='Enter')sendTradeMsg()">
      <button class="btn btn-gold" onclick="sendTradeMsg()">➤</button>
    </div>
  `);
  renderChatBox(); renderQuickBtns();
  setTimeout(() => { const f = $('#chatField'); if (f) f.focus(); }, 120);
}

function renderChatBox() {
  const box = $('#chatBox');
  if (!box) return;
  const av = tradeChat.item.npc.avatar;
  let html = tradeChat.messages.map(m => {
    if (m.who === 'sys') return `<div class="msg-sys ${m.cls || ''}">${m.text}</div>`;
    if (m.who === 'me') {
      const avHtml = state.player.avatarImage
        ? `<div class="msg-av"><img src="${state.player.avatarImage}" alt=""></div>`
        : `<div class="msg-av">${state.player.avatar}</div>`;
      return `<div class="msg me">${avHtml}<div class="msg-bubble">${m.text}</div></div>`;
    }
    return `<div class="msg npc"><div class="msg-av">${av}</div><div class="msg-bubble">${m.text}</div></div>`;
  }).join('');
  if (tradeChat.typing) html += `<div class="msg npc"><div class="msg-av">${av}</div><div class="typing-bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div></div>`;
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

function renderQuickBtns() {
  const box = $('#quickBtns');
  if (!box) return;
  if (tradeChat.done) { box.innerHTML = ''; return; }
  box.classList.toggle('locked', tradeChat.typing);
  const it = tradeChat.item;
  const b1 = round100(it.askPrice * 0.85);
  const b2 = round100(it.askPrice * 0.72);
  box.innerHTML = `
    <button class="qbtn" onclick="quickOffer(${b1})">Предложить ${fmt(b1)}</button>
    <button class="qbtn" onclick="quickOffer(${b2})">Предложить ${fmt(b2)}</button>
    <button class="qbtn" onclick="quickOffer(${it.askPrice})">Беру за ${fmt(it.askPrice)}</button>
    <button class="qbtn" onclick="quickText('А скидку сделаете?')">«Скидку?»</button>
    <button class="qbtn" onclick="quickText('Расскажите о состоянии')">«Состояние?»</button>
    <button class="qbtn" onclick="quickText('Почему продаёте?')">«Причина?»</button>
    <button class="qbtn" onclick="quickText('Как с оплатой?')">«Оплата?»</button>`;
}

function lockChat() {
  tradeChat.typing = true;
  renderChatBox(); renderQuickBtns();
  const f = $('#chatField'); if (f) f.disabled = true;
  const b = $('.chat-input .btn'); if (b) b.disabled = true;
}
function unlockChat() {
  if (!tradeChat) return;
  tradeChat.typing = false;
  renderChatBox(); renderQuickBtns();
  const f = $('#chatField'); if (f) { f.disabled = false; f.focus(); }
  const b = $('.chat-input .btn'); if (b) b.disabled = false;
}

function quickOffer(n) {
  if (!tradeChat || tradeChat.done || tradeChat.typing) return;
  const f = $('#chatField'); if (f) f.value = '';
  meSay('Предлагаю ' + fmt(n));
  renderChatBox();
  processTradeInput(n, ['offer']);
}
function quickText(t) {
  if (!tradeChat || tradeChat.done || tradeChat.typing) return;
  meSay(t);
  renderChatBox();
  processTradeInput(null, null, t);
}
function sendTradeMsg() {
  const f = $('#chatField');
  if (!f || !tradeChat || tradeChat.done || tradeChat.typing) return;
  const text = f.value.trim();
  if (!text) return;
  f.value = '';
  meSay(esc(text));
  renderChatBox();
  const offer = extractNumber(text);
  processTradeInput(offer, null, text);
}

async function processTradeInput(offer, _tags, text) {
  const tc = tradeChat;
  if (!tc || tc.done) return;
  lockChat();
  await sleep(rnd(3000, 6000));
  if (!tradeChat || tradeChat !== tc) return;
  const it = tc.item;
  const intents = text ? detectIntents(text) : ['offer'];
  tc.turns++;
  intents.forEach(i => tc.discussed.add(i));

  if (intents.includes('polite')) it.npc.patience = Math.min(it.npc.maxPatience, it.npc.patience + 3);
  if (intents.includes('complement')) { it.npc.patience = Math.min(it.npc.maxPatience, it.npc.patience + 8); tc.mood = 'happy'; }
  if (intents.includes('insult')) { it.npc.patience -= 30; tc.mood = 'angry'; }
  if (intents.includes('insult') && it.npc.patience <= 0) return npcLeaves();

  if (offer !== null && offer > 0) {
    if (tc.lastOffer === offer) tc.repeats++; else tc.repeats = 0;
    tc.lastOffer = offer;
    return handleOffer(offer, intents);
  }

  const responses = [];
  if (intents.includes('ask_discount') || intents.includes('too_expensive')) {
    it.npc.patience -= 7;
    tc.lowballsCount++;
    if (it.npc.stubborn > 0.65) {
      responses.push(pick([
        `Скидку? ${it.name} и так по хорошей цене. ${fmt(it.askPrice)} — и никаких скидок.`,
        `Слушай, я не из тех, кто просто так уступает. ${fmt(it.askPrice)} — вот моё слово.`,
        `Давай без этого. Моя цена — ${fmt(it.askPrice)}. Нравится — бери.`
      ]));
    } else if (tc.discussed.has('_d')) {
      responses.push('Я уже говорил про скидку. Назови свою цену, и обсудим.');
    } else {
      tc.discussed.add('_d');
      const np = round100(it.askPrice * rnd(0.88, 0.95));
      it.askPrice = Math.min(it.askPrice, np);
      responses.push(pick([`Ладно, скину — ${fmt(np)}. Но это предел.`, `Хорошо, ${fmt(np)}. Дешевле — только если заберёшь всё сразу.`, `Уговорил. ${fmt(np)} — окончательная.`]));
    }
  } else if (intents.includes('ask_condition')) {
    it.npc.patience -= 2;
    if (tc.discussed.has('_c')) responses.push('Я уже говорил про состояние. По цене что скажешь?');
    else { tc.discussed.add('_c'); responses.push(pick([`Состояние честное — ${it.name} полностью рабочий.`, `Всё в порядке, никаких дефектов. Можешь проверить лично.`, `Работает отлично. Пара мелких царапин — на функционал не влияет.`])); }
  } else if (intents.includes('ask_accessories')) {
    it.npc.patience -= 2; tc.discussed.add('_a');
    responses.push(pick([`Комплект полный — коробка, документы, всё на месте.`, `Коробки нет, но чек и все причиндалы отдам.`, `Всё, что на фото, всё ваше.`]));
  } else if (intents.includes('ask_reason')) {
    responses.push(pick([`Да просто — ${pick(REASONS[it.cat])}.`, `Причина простая: ${pick(REASONS[it.cat])}.`]));
  } else if (intents.includes('ask_delivery')) {
    it.npc.patience -= 3;
    responses.push(pick([`Самовывоз. Могу встретиться в центре.`, `Давай самовывозом. Мне так спокойнее.`, `Только самовывоз.`]));
  } else if (intents.includes('ask_payment')) {
    responses.push(pick([`Наличными. Никаких переводов.`, `СБП или наличные — как удобно.`, `Перевод на карту подойдёт.`]));
  } else if (intents.includes('ask_location')) {
    responses.push(pick([`Могу встретиться у метро в центре.`, `Самовывоз, адрес скину в личку.`, `Давай на нейтральной территории.`]));
  } else if (intents.includes('ask_trade')) {
    it.npc.patience -= 5;
    responses.push(pick([`Трейд? Не, мне нужны деньги. Только продажа.`, `Обмен не интересует. За наличные — да.`, `Не, давай без обмена.`]));
  } else if (intents.includes('ask_photos')) {
    responses.push(pick([`Фото выше выложил, всё видно.`, `Все фото в объявлении.`, `Фотки все есть. Могу ещё скинуть, если надо.`]));
  } else if (intents.includes('ask_price')) {
    it.npc.patience -= 2;
    responses.push(pick([`Прошу ${fmt(it.askPrice)}, но подвинусь для серьёзного покупателя.`, `${fmt(it.askPrice)} — вот моя цена.`, `Изначально ${fmt(it.askPrice)}. Торг возможен.`]));
  } else if (intents.includes('ask_negotiable')) {
    responses.push(pick([`Торг есть, но не до бесплатного. Назови цифру.`, `Можно подвинуться, если предложение адекватное.`, `Всё обсуждаемо. Говори свою цену.`]));
  } else if (intents.includes('greeting')) {
    responses.push(pick([`Здравствуйте! Да, всё в силе. Слушаю.`, `Привет-привет! Ну что, берёте?`, `Добрый день. Да, актуально.`]));
  } else if (intents.includes('distrust')) {
    it.npc.patience -= 18; tc.mood = 'angry';
    responses.push(pick([`Слушай, я не мошенник. Не хочешь — не бери.`, `За кого ты меня принимаешь? Всё честно.`, `Если не доверяешь — просто не покупай.`]));
  } else if (intents.includes('urgency')) {
    it.npc.patience -= 3;
    responses.push(pick([`Торопишься? Назови адекватную цену — и забирай.`, `Раз срочно — я тоже не хочу тянуть.`, `Если заберёшь сегодня — немного уступлю.`]));
  } else if (intents.includes('ask_age')) {
    it.npc.patience -= 2;
    responses.push(pick([`Пользуюсь примерно ${Math.floor(rnd(1, 4))} года. Всё как новое.`, `Купил(а) недавно, почти не использовал(а).`, `Брал(а) ещё в прошлом году. Всё работает.`]));
  } else if (intents.includes('accept')) {
    if (it.askPrice <= state.player.money) return acceptSellerDeal(it.askPrice);
    responses.push(`Рад, что согласен! Но у тебя же ${fmt(state.player.money)}, а прошу ${fmt(it.askPrice)}.`);
    it.npc.patience -= 5;
  } else {
    it.npc.patience -= 4;
    responses.push(pick(['Так, ближе к делу. Сколько предлагаешь?', 'Не понял. По цене что скажешь?', 'Хорош болтать — называй сумму.', 'Назови цену, и обсудим.']));
  }

  for (let i = 0; i < responses.length; i++) {
    if (i > 0) {
      tradeChat.typing = true;
      renderChatBox(); renderQuickBtns();
      await sleep(rnd(1500, 3000));
      if (!tradeChat || tradeChat !== tc) return;
      tradeChat.typing = false;
    }
    npcSay(responses[i]);
    renderChatBox();
  }
  if (it.npc.patience <= 0) return npcLeaves();
  unlockChat();
}

function handleOffer(num, intents) {
  const it = tradeChat.item;
  const tc = tradeChat;
  if (num > state.player.money) {
    npcSay(pick([`Слушай, у тебя же нет ${fmt(num)}. У тебя всего ${fmt(state.player.money)}.`, `Ты сначала деньги покажи, потом такую цену называй.`, `Хорошая шутка. Но у тебя нет столько.`]));
    it.npc.patience -= 8;
    if (it.npc.patience <= 0) return npcLeaves();
    return unlockChat();
  }
  if (it.npc.stubborn > 0.7 && num < it.askPrice * 0.95) {
    tc.refusals++;
    if (tc.refusals >= 3 || it.npc.patience <= 25) {
      npcSay(pick([`Слушай, я не торгуюсь. ${fmt(it.askPrice)}, и точка.`, `Я же сказал — цена финальная. Всё.`, `Всё, хватит. Не продам дешевле. Пока.`]));
      return npcLeaves();
    }
    it.npc.patience -= 15;
    npcSay(pick([`За ${fmt(num)}? Я же сказал — ${fmt(it.askPrice)}.`, `${fmt(it.askPrice)}, и всё тут.`, `Слушай, у меня цена железная — ${fmt(it.askPrice)}.`]));
    if (it.npc.patience <= 0) return npcLeaves();
    return unlockChat();
  }
  if (num >= it.minPrice) {
    if (it.npc.stubborn > 0.55 && num < it.askPrice * 0.92 && Math.random() < 0.45) {
      const counter = round100(Math.min(it.askPrice, num * 1.06));
      npcSay(pick([`Почти. Добавь до ${fmt(counter)} — и по рукам.`, `${fmt(num)} маловато. Давай ${fmt(counter)} и забирай.`, `Ладно, ${fmt(counter)} — и расходимся.`]));
      tc.lastOffer = counter;
      return unlockChat();
    }
    return acceptSellerDeal(num);
  }
  tc.lowballsCount++;
  if (num < it.minPrice * 0.55) {
    it.npc.patience -= 30; tc.mood = 'angry';
    if (it.npc.patience <= 0 || tc.lowballsCount >= 3) {
      npcSay(pick([`Слушай, за ${fmt(num)} ты в магазин иди. Всё, до свидания.`, `Я не настолько глуп, чтобы за ${fmt(num)} отдать ${it.name}. Пока.`, `Всё, хватит. С такими предложениями — не ко мне.`]));
      return npcLeaves();
    }
    const counter = round100(it.minPrice * rnd(1.05, 1.15));
    npcSay(pick([`За ${fmt(num)}? Ты серьёзно? Минимум ${fmt(counter)}.`, `Ха-ха, ${fmt(num)}. Назови реальную цену — ${fmt(counter)}.`, `За такие деньги я лучше сам пользоваться буду. ${fmt(counter)}.`]));
    return unlockChat();
  }
  if (tc.repeats >= 2) {
    it.npc.patience -= 25;
    if (it.npc.patience <= 0) return npcLeaves();
    npcSay(pick(['Ты уже предлагал столько же. Я своё слово сказал.', 'Сколько раз повторять? Не пойдёт за эту сумму.', 'Ты меня не слышишь. Другую цену назови.']));
    return unlockChat();
  }
  const gap = it.minPrice - num, gapRatio = gap / it.minPrice;
  if (gapRatio <= 0.06) {
    it.npc.patience -= 6;
    if (Math.random() < 0.4 || intents.includes('accept')) return acceptSellerDeal(num);
    const c = round100(Math.min(num * 1.06, it.minPrice));
    npcSay(pick([`Почти договорились. ${fmt(c)} — и по рукам.`, `Ещё чуть-чуть. Давай ${fmt(c)}.`, `Согласен почти. Добавь до ${fmt(c)}.`]));
  } else if (gapRatio <= 0.15) {
    it.npc.patience -= 14;
    const c = round100(it.minPrice * rnd(1.0, 1.03));
    npcSay(pick([`${fmt(num)} мало. ${fmt(c)} — и забирай.`, `Добавь до ${fmt(c)}, и договорились.`, `Могу отдать за ${fmt(c)}, но не меньше.`]));
  } else {
    it.npc.patience -= 22;
    const c = round100(it.minPrice * rnd(1.05, 1.10));
    npcSay(pick([`Серьёзно? ${fmt(num)} — это сильно ниже. Минимум ${fmt(c)}.`, `Не пойдёт за ${fmt(num)}. Реальная цена — ${fmt(c)}.`, `${fmt(c)}, и я закрою глаза на твою наглость.`]));
  }
  if (it.npc.patience <= 0) return npcLeaves();
  unlockChat();
}

function npcLeaves() {
  tradeChat.done = true;
  npcSay(pick(['Всё, терпение лопнуло. Не хочу больше с тобой торговаться. 👋', 'Устал я от этого торга. Продам другому.', 'Хватит. Настроение пропало, ничего тебе не продам.', 'Не умеешь ты торговаться. Всё, до свидания.']));
  sysSay('Продавец ушёл из чата', 'bad');
  state.market = state.market.filter(x => x.uid !== tradeChat.item.uid);
  refillMarket(); saveGame();
  renderChatBox(); renderQuickBtns();
  setTimeout(() => { if ($('#chatBox')) { closeModal(); renderView(); } }, 2200);
}

function acceptSellerDeal(price) {
  const it = tradeChat.item;
  tradeChat.done = true;
  state.player.money -= price;
  addToInventory(it, price);
  state.market = state.market.filter(x => x.uid !== it.uid);
  refillMarket(); state.stats.bought++;
  npcSay(pick([`По рукам! 🤝 Забирай за ${fmt(price)}.`, `Договорились! ${fmt(price)} — и вещь твоя.`, `Отлично, ${fmt(price)}. Спасибо!`]));
  sysSay(`Вы купили «${esc(it.name)}» за ${fmt(price)}`, 'ok');
  renderChatBox(); renderQuickBtns(); renderPlayerBar();
  saveGame(); popMoney(price, false);
  setTimeout(() => { closeModal(); renderView(); }, 1500);
}

/* ===== ВЫСТАВЛЕНИЕ ===== */
function openListForm(invUid) {
  const item = state.inventory.find(i => i.uid === invUid);
  if (!item) return;
  const minRec = round100(item.value * 0.6);
  const maxRec = round100(item.value * 1.4);
  const suggested = round100(item.value * 1.02);
  showModal(`
    <div class="modal-head">
      <div class="mh-avatar">${item.emoji}</div>
      <div><div class="mh-name">${esc(item.name)}</div>
        <div class="mh-sub">Рыночная стоимость ~ ${fmt(item.value)}</div></div>
      <button class="close-x" onclick="closeModal()">✕</button>
    </div>
    <div class="field">
      <label>Цена продажи</label>
      <div class="range-hint">
        <span class="rh-min">Мин: ${fmt(minRec)}</span>
        <span class="rh-mid">Рекомендуем: ${fmt(item.value)}</span>
        <span class="rh-max">Макс: ${fmt(maxRec)}</span>
      </div>
      <div class="price-value-display" id="priceDisplay">${fmt(suggested)}</div>
      <div class="range-wrap">
        <input type="range" class="price-slider" id="priceSlider" min="${minRec}" max="${maxRec}" value="${suggested}" step="100" oninput="syncPriceFromSlider(this.value)">
      </div>
      <input type="number" id="sellPrice" value="${suggested}" min="100" step="100" oninput="syncPriceFromInput(this.value)">
    </div>
    <div class="field">
      <label>Срок размещения</label>
      <select id="sellDur">
        <option value="1">1 час — быстро</option>
        <option value="3">3 часа</option>
        <option value="6" selected>6 часов — оптимально</option>
        <option value="12">12 часов</option>
        <option value="24">24 часа — максимум</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;margin-top:22px">
      <button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Отмена</button>
      <button class="btn btn-gold" style="flex:1.4" onclick="createListing(${invUid})">📢 Выставить</button>
    </div>
  `);
}
function syncPriceFromSlider(v) {
  const inp = document.getElementById('sellPrice'); if (inp) inp.value = v;
  const disp = document.getElementById('priceDisplay'); if (disp) disp.textContent = fmt(+v);
}
function syncPriceFromInput(v) {
  const slider = document.getElementById('priceSlider');
  if (slider) { const min = +slider.min, max = +slider.max, num = +v; if (num >= min && num <= max) slider.value = num; }
  const disp = document.getElementById('priceDisplay'); if (disp) disp.textContent = fmt(Math.max(100, +v || 0));
}

function createListing(invUid) {
  const item = state.inventory.find(i => i.uid === invUid);
  if (!item) return;
  const price = Math.max(100, Math.round(+$('#sellPrice').value || 0));
  const dur = +$('#sellDur').value;
  if (!price || price < 100) return toast('⚠️ Некорректная цена', 'Минимум 100 ₽');
  state.inventory = state.inventory.filter(i => i.uid !== invUid);
  state.listings.push({ uid: state.uid++, item, price, total: dur * 60, timeLeft: dur * 60, cooldown: 0, buyer: null });
  closeModal();
  state.tab = 'listings'; renderTabs(); renderView(); saveGame();
  toast('📢 Объявление опубликовано', `${item.name} за ${fmt(price)} · ${dur} ч`);
}

/* ===== ТИК ===== */
const TICK_MIN = 6;
function gameTick() {
  state.gameMin += TICK_MIN;
  let changed = false;
  for (const L of [...state.listings]) {
    if (L.cooldown > 0) L.cooldown -= TICK_MIN;
    L.timeLeft -= TICK_MIN;
    if (L.timeLeft <= 0) {
      state.listings = state.listings.filter(x => x.uid !== L.uid);
      state.inventory.push(L.item);
      toast('⌛ Срок истёк', `${L.item.name} вернулся на склад`);
      changed = true; saveGame(); continue;
    }
    if (L.cooldown <= 0 && !L.buyer) {
      const r = L.price / L.item.value;
      let pPerHour = 0.5 - (r - 0.8) * 1.0;
      pPerHour = clamp(pPerHour, 0.012, 0.6);
      if (Math.random() < pPerHour * (TICK_MIN / 60)) { spawnBuyer(L); saveGame(); }
    }
  }
  if (changed) renderView(); else updateTimers();
}

function spawnBuyer(L) {
  L.buyer = {
    name: pick(NPC_NAMES), avatar: pick(NPC_AVATARS),
    offer: round100(L.price * rnd(0.84, 0.98)),
    maxPrice: round100(L.price * rnd(1.0, 1.13)),
    messages: [], done: false, lastOffer: null, typing: false,
  };
  Sound.playBuyer();
  toastBuyer(L);
}

function toastBuyer(L) {
  const b = L.buyer;
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<div class="toast-ico">${b.avatar}</div>
    <div class="toast-body"><div class="toast-title">${b.name} интересуется</div>
      <div>«${esc(L.item.name)}» — предлагает <b style="color:var(--gold)">${fmt(b.offer)}</b></div>
      <button class="btn btn-gold" onclick="this.closest('.toast').remove(); openBuyerChat(${L.uid})">Ответить</button>
    </div>`;
  $('#toasts').appendChild(t);
  setTimeout(() => { if (t.parentNode) { t.classList.add('out'); setTimeout(() => t.remove(), 350); } }, 22000);
}

/* ===== ЧАТ С ПОКУПАТЕЛЕМ ===== */
let buyChat = null;
function openBuyerChat(uid) {
  const L = state.listings.find(l => l.uid === uid);
  if (!L || !L.buyer) return;
  buyChat = L;
  const b = L.buyer;
  if (!b.messages.length) b.messages.push({
    who: 'npc',
    text: pick([`Здравствуйте! Увидел объявление «${L.item.name}» за ${fmt(L.price)}. Готов взять за ${fmt(b.offer)}.`, `Добрый день. Интересует «${L.item.name}». Предлагаю ${fmt(b.offer)}.`, `Привет! По объявлению. ${fmt(b.offer)} — и я выезжаю.`])
  });
  renderBuyerModal();
}

function renderBuyerModal() {
  const L = buyChat, b = L.buyer;
  showModal(`
    <div class="modal-head">
      <div class="mh-avatar">${b.avatar}</div>
      <div><div class="mh-name">${b.name}</div>
        <div class="mh-sub">Покупатель · торг по объявлению</div></div>
      <button class="close-x" onclick="closeModal()">✕</button>
    </div>
    <div class="trade-item">
      <div class="ti-emoji">${L.item.emoji}</div>
      <div><div class="ti-name">${esc(L.item.name)}</div>
        <div class="ti-price">Ваша цена: ${fmt(L.price)}</div></div>
    </div>
    <div class="chat" id="chatBox"></div>
    <div class="chat-quick" id="quickBtns"></div>
    <div class="chat-input">
      <input id="chatField" placeholder="Назови свою цену..." onkeydown="if(event.key==='Enter')sendBuyMsg()">
      <button class="btn btn-gold" onclick="sendBuyMsg()">➤</button>
    </div>
  `);
  renderBuyerChatBox(); renderBuyerQuick();
  setTimeout(() => { const f = $('#chatField'); if (f) f.focus(); }, 120);
}

function renderBuyerChatBox() {
  const box = $('#chatBox');
  if (!box) return;
  const b = buyChat.buyer;
  let html = b.messages.map(m => {
    if (m.who === 'sys') return `<div class="msg-sys ${m.cls || ''}">${m.text}</div>`;
    if (m.who === 'me') {
      const avHtml = state.player.avatarImage
        ? `<div class="msg-av"><img src="${state.player.avatarImage}" alt=""></div>`
        : `<div class="msg-av">${state.player.avatar}</div>`;
      return `<div class="msg me">${avHtml}<div class="msg-bubble">${m.text}</div></div>`;
    }
    return `<div class="msg npc"><div class="msg-av">${b.avatar}</div><div class="msg-bubble">${m.text}</div></div>`;
  }).join('');
  if (b.typing) html += `<div class="msg npc"><div class="msg-av">${b.avatar}</div><div class="typing-bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div></div>`;
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

function renderBuyerQuick() {
  const box = $('#quickBtns');
  if (!box) return;
  const b = buyChat.buyer;
  if (b.done) { box.innerHTML = ''; return; }
  box.classList.toggle('locked', b.typing);
  box.innerHTML = `
    <button class="qbtn" onclick="acceptBuyerOffer()">✅ Принять ${fmt(b.offer)}</button>
    <button class="qbtn" onclick="buyerCounter(${buyChat.price})">Настаивать на ${fmt(buyChat.price)}</button>
    <button class="qbtn" onclick="rejectBuyer()">❌ Отказать</button>`;
}

function buySys(t, c) { buyChat.buyer.messages.push({ who: 'sys', text: t, cls: c }); }

async function sendBuyMsg() {
  const f = $('#chatField');
  if (!f || !buyChat || buyChat.buyer.done || buyChat.buyer.typing) return;
  const text = f.value.trim();
  if (!text) return;
  f.value = '';
  buyChat.buyer.messages.push({ who: 'me', text: esc(text) });
  const b = buyChat.buyer;
  b.typing = true;
  renderBuyerChatBox(); renderBuyerQuick();
  f.disabled = true;
  await sleep(rnd(3000, 6000));
  if (!buyChat || buyChat.buyer !== b) return;
  b.typing = false;
  const num = extractNumber(text);
  const intents = detectIntents(text);
  if (num !== null) { f.disabled = false; return buyerCounter(num, intents); }
  if (intents.includes('ask_condition')) b.messages.push({ who: 'npc', text: 'А есть какие-то дефекты? Хочу знать заранее.' });
  else if (intents.includes('greeting') && b.messages.length <= 2) b.messages.push({ who: 'npc', text: 'Да, я по объявлению. Готов обсудить.' });
  else if (intents.includes('ask_delivery')) b.messages.push({ who: 'npc', text: 'Самовывоз удобнее. Когда можно подъехать?' });
  else if (intents.includes('ask_accessories')) b.messages.push({ who: 'npc', text: 'Комплект полный? Коробка, документы?' });
  else if (intents.includes('ask_discount')) b.messages.push({ who: 'npc', text: 'Если скинете — возьму прямо сейчас.' });
  else b.messages.push({ who: 'npc', text: pick(['Так что по цене? Назовите цифру.', 'Сколько хотите?', 'Мне нужно понимать итоговую сумму.']) });
  f.disabled = false;
  renderBuyerChatBox(); renderBuyerQuick();
}

function acceptBuyerOffer() {
  const L = buyChat;
  if (!L || L.buyer.done || L.buyer.typing) return;
  L.buyer.done = true;
  L.buyer.messages.push({ who: 'npc', text: 'Отлично! Договорились 🤝' });
  buySys(`Сделка: ${esc(L.item.name)} за ${fmt(L.buyer.offer)}`, 'ok');
  renderBuyerChatBox(); renderBuyerQuick();
  startPackaging(L, L.buyer.offer);
  setTimeout(() => closeModal(), 1400);
}

function rejectBuyer() {
  const L = buyChat;
  if (!L || L.buyer.done || L.buyer.typing) return;
  L.buyer.done = true;
  L.buyer.messages.push({ who: 'npc', text: 'Жаль. Если передумаете — я на связи.' });
  buySys('Покупатель ушёл', 'bad');
  renderBuyerChatBox(); renderBuyerQuick();
  L.buyer = null; L.cooldown = 20; saveGame();
  setTimeout(() => closeModal(), 1200);
}

function buyerCounter(amount, intents = []) {
  const L = buyChat;
  if (!L || L.buyer.done) return;
  const b = L.buyer;
  if (amount <= b.maxPrice) {
    b.done = true;
    b.messages.push({ who: 'npc', text: pick([`Хорошо, ${fmt(amount)} меня устраивает. Беру!`, `Ладно, за ${fmt(amount)}. Когда забрать?`, `Согласен на ${fmt(amount)}. Сделка!`]) });
    buySys(`Сделка: ${esc(L.item.name)} за ${fmt(amount)}`, 'ok');
    renderBuyerChatBox(); renderBuyerQuick();
    startPackaging(L, amount);
    setTimeout(() => closeModal(), 1400);
  } else if (amount <= b.maxPrice * 1.14) {
    if (b.lastOffer === amount) b.messages.push({ who: 'npc', text: 'Я же сказал — больше не дам.' });
    else {
      b.offer = round100(b.maxPrice);
      b.messages.push({ who: 'npc', text: pick([`Больше ${fmt(b.maxPrice)} не дам. По рукам?`, `Бюджет до ${fmt(b.maxPrice)}. Согласны?`, `Выше ${fmt(b.maxPrice)} не пойду.`]) });
    }
    b.lastOffer = amount;
    renderBuyerChatBox(); renderBuyerQuick();
  } else {
    b.done = true;
    b.messages.push({ who: 'npc', text: pick([`${fmt(amount)}? Слишком дорого. Не договоримся.`, 'За такие деньги лучше новый возьму.', 'Ну это перебор. Я пас.']) });
    buySys('Покупатель отказался', 'bad');
    renderBuyerChatBox(); renderBuyerQuick();
    L.buyer = null; L.cooldown = 25; saveGame();
    setTimeout(() => closeModal(), 1300);
  }
}

/* ===== УПАКОВКА ===== */
let pendingPack = null;

function startPackaging(L, price) {
  pendingPack = { L, price, step: 0 };
  setTimeout(() => { if ($('#chatBox')) { closeModal(); openPackagingModal(); } }, 1500);
}

function openPackagingModal() {
  if (!pendingPack) return;
  const { L, price } = pendingPack;
  showModal(`
    <div class="modal-head">
      <div class="mh-avatar">📦</div>
      <div><div class="mh-name">Упаковка заказа</div>
        <div class="mh-sub">${L.buyer.name} ждёт отправку</div></div>
      <button class="close-x" onclick="abortPack()">✕</button>
    </div>
    <div class="pack-stage" id="packStage">
      <div class="pack-emoji" id="packEmoji">${L.item.emoji}</div>
    </div>
    <div class="pack-info">
      <div class="pi-name">${esc(L.item.name)}</div>
      <div class="pi-price">Сумма к получению: ${fmt(price)}</div>
    </div>
    <div class="pack-steps">
      <div class="pack-step active" id="step1">
        <div class="ps-num">1</div>
        <div class="ps-text">Положить в коробку</div>
      </div>
      <div class="pack-step" id="step2">
        <div class="ps-num">2</div>
        <div class="ps-text">Заклеить скотчем</div>
      </div>
      <div class="pack-step" id="step3">
        <div class="ps-num">3</div>
        <div class="ps-text">Отправить</div>
      </div>
    </div>
    <button class="btn btn-gold" style="width:100%;margin-top:10px" id="packBtn" onclick="packNext()">📦 Взять коробку</button>
  `);
}

function packNext() {
  if (!pendingPack) return;
  const stage = document.getElementById('packStage');
  const btn = document.getElementById('packBtn');
  if (!stage || !btn) return;
  pendingPack.step++;

  if (pendingPack.step === 1) {
    Sound.playPack();
    stage.innerHTML = `<div class="pack-box-anim">📦</div>`;
    document.getElementById('step1').classList.remove('active');
    document.getElementById('step1').classList.add('done');
    document.getElementById('step2').classList.add('active');
    btn.textContent = '📏 Заклеить скотчем';
  } else if (pendingPack.step === 2) {
    Sound.playTape();
    stage.innerHTML = `<div class="pack-box-anim taped">📦</div><div class="tape-strip"></div>`;
    document.getElementById('step2').classList.remove('active');
    document.getElementById('step2').classList.add('done');
    document.getElementById('step3').classList.add('active');
    btn.textContent = '🚚 Отправить заказ';
  } else if (pendingPack.step === 3) {
    Sound.playSend();
    stage.innerHTML = `<div class="pack-box-anim flying">📦</div>`;
    document.getElementById('step3').classList.remove('active');
    document.getElementById('step3').classList.add('done');
    btn.disabled = true;
    btn.textContent = '⏳ Отправляем...';
    setTimeout(finalizePackaging, 1400);
  }
}

function finalizePackaging() {
  if (!pendingPack) return;
  const { L, price } = pendingPack;
  Sound.playSuccess();
  state.player.money += price;
  state.listings = state.listings.filter(x => x.uid !== L.uid);
  state.stats.sold++;
  state.stats.profit += price - L.item.buyPrice;
  saveGame();
  popMoney(price, true);
  renderPlayerBar();

  showModal(`
    <div style="text-align:center;padding:22px">
      <div class="pack-success">✅</div>
      <div style="font-size:22px;font-weight:900;color:var(--green);margin:16px 0 8px">Заказ отправлен!</div>
      <div style="font-size:14px;color:var(--muted);margin-bottom:22px">${esc(L.item.name)}</div>
      <div style="font-size:36px;font-weight:900;color:var(--green);margin-bottom:24px;text-shadow:0 0 20px rgba(52,211,153,.5)">+${fmt(price)}</div>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:20px">Профит: ${fmt(price - L.item.buyPrice)}</div>
      <button class="btn btn-gold" style="width:100%" onclick="closeModal();renderView()">Отлично!</button>
    </div>
  `);
  toast('💰 Продано!', `${L.item.name} за ${fmt(price)}`);
  pendingPack = null;
}

function abortPack() {
  if (!pendingPack) return;
  if (!confirm('Прервать упаковку? Покупатель может передумать.')) return;
  const { L } = pendingPack;
  L.buyer = null;
  L.cooldown = 30;
  pendingPack = null;
  closeModal();
  toast('⚠️ Упаковка прервана', 'Покупатель ушёл');
  saveGame(); renderView();
}

/* ===== ТОСТЫ ===== */
function toast(title, text) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<div class="toast-ico">🔔</div><div class="toast-body"><div class="toast-title">${title}</div><div>${text || ''}</div></div>`;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 350); }, 4200);
}

/* ===== СТАРТ ===== */
function init() {
  if (!loadGame()) newGame();
  else { refillMarket(); setTimeout(() => toast('💾 Сохранение загружено', `${state.player.name} · ${fmt(state.player.money)}`), 400); }
  applyTheme(state.theme);
  renderTabs(); renderView();
  setInterval(gameTick, 1000);
  setInterval(saveGame, 3000);
  window.addEventListener('beforeunload', saveGame);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
  // Инициализация звука при первом клике (браузеры требуют user gesture)
  document.addEventListener('click', function initSound() {
    Sound.init();
    document.removeEventListener('click', initSound);
  }, { once: true });
}

init();
</script>
</body>
</html>
