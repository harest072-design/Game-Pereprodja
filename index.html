<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПЕРЕКУП PRO — торгуйся и богатей</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070912;--panel:rgba(22,26,44,.72);--panel2:rgba(32,38,62,.6);
  --stroke:rgba(255,255,255,.085);--txt:#e9edf8;--muted:#8b93ad;
  --gold:#ffd166;--gold2:#ffb020;--violet:#8b5cf6;--green:#34d399;
  --red:#f87171;--blue:#60a5fa;--orange:#fb923c;
}
html{scroll-behavior:smooth}
body{
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',sans-serif;
  background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(255,209,102,.35),rgba(139,92,246,.35));border-radius:9px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,rgba(255,209,102,.6),rgba(139,92,246,.6))}

.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.5}
.b1{width:560px;height:560px;background:#6d28d9;top:-180px;left:-160px;animation:f1 20s ease-in-out infinite}
.b2{width:480px;height:480px;background:#0e7490;bottom:-180px;right:-140px;animation:f2 24s ease-in-out infinite}
.b3{width:420px;height:420px;background:#b45309;top:45%;left:52%;opacity:.22;animation:f3 28s ease-in-out infinite}
@keyframes f1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(90px,70px) scale(1.15)}}
@keyframes f2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-90px,-60px) scale(1.12)}}
@keyframes f3{0%,100%{transform:translate(0,0)}50%{transform:translate(-120px,80px)}}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1px);background-size:34px 34px}

#app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:20px 16px 90px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{width:52px;height:52px;display:grid;place-items:center;font-size:26px;border-radius:16px;background:linear-gradient(145deg,rgba(255,209,102,.22),rgba(139,92,246,.22));border:1px solid rgba(255,209,102,.32);box-shadow:0 0 30px rgba(255,176,32,.18),inset 0 1px 0 rgba(255,255,255,.12);animation:pulseGlow 3.5s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 26px rgba(255,176,32,.15),inset 0 1px 0 rgba(255,255,255,.12)}50%{box-shadow:0 0 44px rgba(255,176,32,.34),inset 0 1px 0 rgba(255,255,255,.12)}}
.logo-title{font-size:20px;font-weight:900;letter-spacing:2px;line-height:1.1}
.logo-title span{background:linear-gradient(90deg,var(--gold),var(--gold2),#fff2c4,var(--gold2),var(--gold));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 5s linear infinite}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.logo-sub{font-size:10.5px;letter-spacing:2.4px;color:var(--muted);text-transform:uppercase;margin-top:3px}

.player-bar{display:flex;align-items:center;gap:12px;padding:9px 16px 9px 9px;border-radius:18px;background:var(--panel);border:1px solid var(--stroke);backdrop-filter:blur(16px);box-shadow:0 10px 32px rgba(0,0,0,.4);position:relative}
.mini-avatar{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:linear-gradient(145deg,rgba(139,92,246,.35),rgba(96,165,250,.25));border:1px solid rgba(255,255,255,.14)}
.mini-name{font-weight:700;font-size:14px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-money{font-size:13px;font-weight:800;letter-spacing:.4px;background:linear-gradient(90deg,var(--gold),#ffe9a8,var(--gold2),var(--gold));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 4s ease infinite}
.money-pop{position:fixed;right:24px;top:60px;font-weight:900;pointer-events:none;animation:moneyPop 1.6s ease forwards;font-size:16px;z-index:300;text-shadow:0 0 16px rgba(52,211,153,.7)}
@keyframes moneyPop{0%{opacity:0;transform:translateY(0) scale(.8)}20%{opacity:1;transform:translateY(-6px) scale(1.1)}100%{opacity:0;transform:translateY(-60px) scale(1)}}

.tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.tab{padding:11px 20px;border-radius:14px;border:1px solid var(--stroke);cursor:pointer;background:var(--panel2);color:var(--muted);font-size:13.5px;font-weight:700;transition:.22s;backdrop-filter:blur(12px);font-family:inherit;position:relative}
.tab:hover{color:var(--txt);border-color:rgba(255,255,255,.2);transform:translateY(-2px)}
.tab.active{background:linear-gradient(135deg,rgba(255,209,102,.2),rgba(255,176,32,.1));color:var(--gold);border-color:rgba(255,209,102,.45);box-shadow:0 6px 24px rgba(255,176,32,.16)}
.tab.active::after{content:'';position:absolute;left:50%;bottom:-6px;width:55%;height:2px;background:var(--gold);transform:translateX(-50%);border-radius:2px;box-shadow:0 0 12px var(--gold),0 0 20px rgba(255,209,102,.6)}

.btn{font-family:inherit;cursor:pointer;border:none;border-radius:12px;padding:11px 18px;font-size:13.5px;font-weight:800;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:7px;position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(140deg,rgba(255,255,255,.2),transparent 50%);opacity:0;transition:.25s;pointer-events:none}
.btn:hover::before{opacity:1}
.btn:active{transform:scale(.96)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#231a04;box-shadow:0 6px 20px rgba(255,176,32,.28)}
.btn-gold:hover{box-shadow:0 10px 30px rgba(255,176,32,.5);transform:translateY(-2px)}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--txt);border:1px solid var(--stroke)}
.btn-ghost:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.24)}
.btn-red{background:rgba(248,113,113,.14);color:var(--red);border:1px solid rgba(248,113,113,.34)}
.btn-red:hover{background:rgba(248,113,113,.24)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none}

.section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.section-title{font-size:19px;font-weight:900;letter-spacing:.4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.section-title small{color:var(--muted);font-weight:600;font-size:12px;letter-spacing:0}
.cat-badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:9px;background:rgba(255,209,102,.14);color:var(--gold);border:1px solid rgba(255,209,102,.32);letter-spacing:.3px}

.filters{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:7px 15px;border-radius:11px;font-size:12.5px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.05);border:1px solid var(--stroke);color:var(--muted);transition:.18s;font-family:inherit}
.chip:hover{color:var(--txt);border-color:rgba(255,255,255,.22)}
.chip.active{background:rgba(139,92,246,.24);border-color:rgba(139,92,246,.5);color:#c4b5fd;box-shadow:0 4px 18px rgba(139,92,246,.2)}

/* --- ЦЕНОВОЙ ФИЛЬТР --- */
.price-filter{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:13px 15px;background:var(--panel);border:1px solid var(--stroke);border-radius:16px;margin-bottom:16px;backdrop-filter:blur(14px)}
.pf-label{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;flex-shrink:0}
.pf-inputs{display:flex;gap:7px;align-items:center;min-width:220px;flex:1}
.pf-inputs input{width:100%;min-width:80px;background:rgba(255,255,255,.06);border:1px solid var(--stroke);border-radius:10px;padding:9px 12px;color:var(--txt);font-family:inherit;font-size:13px;outline:none;transition:.2s;font-weight:700}
.pf-inputs input:focus{border-color:rgba(255,209,102,.5);background:rgba(255,255,255,.09);box-shadow:0 0 0 3px rgba(255,209,102,.1)}
.pf-dash{color:var(--muted);font-weight:700;flex-shrink:0}
.pf-presets{display:flex;gap:6px;flex-wrap:wrap}
.pf-preset{padding:6px 11px;border-radius:9px;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.05);border:1px solid var(--stroke);color:var(--muted);cursor:pointer;transition:.15s;font-family:inherit;white-space:nowrap}
.pf-preset:hover{color:var(--txt);border-color:rgba(255,255,255,.2)}
.pf-preset.active{background:rgba(255,209,102,.16);border-color:rgba(255,209,102,.4);color:var(--gold);box-shadow:0 2px 10px rgba(255,209,102,.15)}
.pf-reset{padding:6px 11px;border-radius:9px;font-size:11.5px;font-weight:700;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--red);cursor:pointer;transition:.15s;font-family:inherit;white-space:nowrap}
.pf-reset:hover{background:rgba(248,113,113,.2)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:15px}

.card{background:var(--panel);border:1px solid var(--stroke);border-radius:20px;padding:17px;backdrop-filter:blur(16px);position:relative;transition:.3s cubic-bezier(.2,.8,.3,1);display:flex;flex-direction:column;gap:9px;isolation:isolate}
.card::before{content:'';position:absolute;inset:0;border-radius:20px;padding:1px;background:linear-gradient(140deg,rgba(255,255,255,.22),transparent 45%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:1}
.card::after{content:'';position:absolute;inset:-2px;border-radius:22px;background:linear-gradient(140deg,rgba(255,209,102,.45),transparent 45%,rgba(139,92,246,.4));opacity:0;transition:.3s;z-index:-1;filter:blur(12px)}
.card:hover{transform:translateY(-6px) scale(1.012);border-color:rgba(255,255,255,.2);box-shadow:0 22px 50px rgba(0,0,0,.55)}
.card:hover::after{opacity:.9}
.card-emoji{font-size:36px;line-height:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5));position:relative;display:inline-block;width:fit-content}
.card-emoji::before{content:'';position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,rgba(255,209,102,.45),transparent 65%);opacity:0;transition:.35s;pointer-events:none;z-index:-1}
.card:hover .card-emoji::before{opacity:1}
.card-cat{position:absolute;top:14px;right:14px;font-size:10px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);background:rgba(255,255,255,.06);padding:4px 9px;border-radius:8px;border:1px solid var(--stroke);z-index:2}
.card-cat[data-cat="Техника"]{background:rgba(96,165,250,.15);color:#93c5fd;border-color:rgba(96,165,250,.3)}
.card-cat[data-cat="Мебель"]{background:rgba(139,92,246,.15);color:#c4b5fd;border-color:rgba(139,92,246,.3)}
.card-cat[data-cat="Авто"]{background:rgba(248,113,113,.15);color:#fca5a5;border-color:rgba(248,113,113,.3)}
.card-cat[data-cat="Разное"]{background:rgba(255,209,102,.15);color:#fcd34d;border-color:rgba(255,209,102,.3)}
.card-cat[data-cat="Инструменты"]{background:rgba(52,211,153,.15);color:#6ee7b7;border-color:rgba(52,211,153,.3)}
.card-cat[data-cat="Спорт"]{background:rgba(251,146,60,.15);color:#fdba74;border-color:rgba(251,146,60,.3)}
.card-name{font-size:14.5px;font-weight:800;line-height:1.3}
.card-price{font-size:19px;font-weight:900;color:var(--gold);letter-spacing:.3px}
.card-seller{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card-seller b{color:#b9c2da;font-weight:700}
.tag{font-size:10px;padding:2px 7px;border-radius:7px;background:rgba(139,92,246,.2);color:#c4b5fd;font-weight:700}
.card-actions{display:flex;gap:8px;margin-top:4px}
.card-actions .btn{flex:1;padding:10px 8px;font-size:12.5px;border-radius:11px}

/* --- ПАГИНАЦИЯ --- */
.pagination{margin-top:24px;padding:16px;background:var(--panel);border:1px solid var(--stroke);border-radius:18px;backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:12px}
.pg-info{text-align:center;font-size:12.5px;color:var(--muted);font-weight:600}
.pg-info b{color:var(--gold);font-weight:800}
.pg-controls{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap}
.page-btn{min-width:38px;height:38px;padding:0 10px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--stroke);color:var(--txt);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:.18s}
.page-btn:hover:not(:disabled):not(.active){background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.24);transform:translateY(-1px)}
.page-btn.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#231a04;border-color:var(--gold);box-shadow:0 4px 14px rgba(255,176,32,.35);cursor:default}
.page-btn:disabled{opacity:.32;cursor:not-allowed}
.page-btn.page-nav{font-size:12px;padding:0 13px;color:var(--gold);border-color:rgba(255,209,102,.35);background:rgba(255,209,102,.1)}
.page-btn.page-nav:hover:not(:disabled){background:rgba(255,209,102,.2);border-color:rgba(255,209,102,.5)}
.page-ellipsis{padding:0 6px;color:var(--muted);font-weight:700;line-height:38px}

.empty{text-align:center;padding:60px 20px;color:var(--muted);background:var(--panel);border:1px dashed var(--stroke);border-radius:22px}
.empty-ico{font-size:52px;margin-bottom:14px;opacity:.55}
.empty b{display:block;color:var(--txt);font-size:16px;margin-bottom:6px}

.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:18px;background:rgba(3,5,12,.72);backdrop-filter:blur(9px);opacity:0;transition:.24s;overflow-y:auto}
.overlay.show{opacity:1}
.modal{width:100%;max-width:520px;background:linear-gradient(170deg,rgba(28,33,54,.98),rgba(16,19,33,.99));border:1px solid rgba(255,255,255,.13);border-radius:24px;padding:22px;box-shadow:0 30px 90px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.08),0 0 80px rgba(139,92,246,.12);transform:scale(.94) translateY(12px);transition:.26s cubic-bezier(.2,.9,.3,1);max-height:92vh;display:flex;flex-direction:column;position:relative;margin:auto}
.overlay.show .modal{transform:scale(1) translateY(0)}

.modal-head{display:flex;align-items:center;gap:13px;margin-bottom:16px;flex-shrink:0}
.mh-avatar{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:linear-gradient(145deg,rgba(139,92,246,.34),rgba(96,165,250,.22));border:1px solid rgba(255,255,255,.15);flex-shrink:0;box-shadow:0 8px 24px rgba(139,92,246,.25),inset 0 1px 0 rgba(255,255,255,.1)}
.mh-name{font-weight:800;font-size:15.5px}
.mh-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.close-x{margin-left:auto;background:rgba(255,255,255,.07);border:1px solid var(--stroke);color:var(--muted);width:34px;height:34px;border-radius:11px;cursor:pointer;font-size:15px;transition:.18s;flex-shrink:0;font-family:inherit}
.close-x:hover{background:rgba(248,113,113,.2);color:var(--red);border-color:rgba(248,113,113,.4)}

.trade-item{display:flex;align-items:center;gap:13px;padding:13px;border-radius:16px;background:rgba(255,255,255,.045);border:1px solid var(--stroke);margin-bottom:14px;flex-shrink:0}
.ti-emoji{font-size:32px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.ti-name{font-weight:800;font-size:14px}
.ti-price{font-size:12.5px;color:var(--gold);font-weight:700;margin-top:2px}

.chat{flex:1;min-height:180px;max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px 4px 10px;scroll-behavior:smooth}
.msg{display:flex;gap:9px;align-items:flex-end;animation:msgIn .3s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.msg.me{flex-direction:row-reverse}
.msg-av{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:rgba(255,255,255,.08);flex-shrink:0;border:1px solid var(--stroke)}
.msg-bubble{padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.45;max-width:78%;word-wrap:break-word;white-space:pre-wrap}
.msg.npc .msg-bubble{background:rgba(255,255,255,.075);border:1px solid var(--stroke);border-bottom-left-radius:5px}
.msg.me .msg-bubble{background:linear-gradient(135deg,rgba(255,209,102,.92),rgba(255,176,32,.92));color:#241a04;font-weight:600;border-bottom-right-radius:5px;box-shadow:0 4px 14px rgba(255,176,32,.18)}
.msg-sys{align-self:center;font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.05);padding:6px 14px;border-radius:20px;border:1px solid var(--stroke);text-align:center;max-width:90%}
.msg-sys.ok{color:var(--green);border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.1)}
.msg-sys.bad{color:var(--red);border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.1)}

.chat-quick{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 10px;flex-shrink:0}
.qbtn{font-family:inherit;font-size:12px;font-weight:700;padding:8px 13px;border-radius:10px;background:rgba(139,92,246,.16);border:1px solid rgba(139,92,246,.35);color:#c4b5fd;cursor:pointer;transition:.18s}
.qbtn:hover{background:rgba(139,92,246,.3);transform:translateY(-2px);box-shadow:0 4px 14px rgba(139,92,246,.25)}

.chat-input{display:flex;gap:9px;flex-shrink:0}
.chat-input input{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--stroke);border-radius:13px;padding:13px 16px;color:var(--txt);font-size:13.5px;font-family:inherit;outline:none;transition:.2s}
.chat-input input:focus{border-color:rgba(255,209,102,.5);background:rgba(255,255,255,.09);box-shadow:0 0 0 3px rgba(255,209,102,.1)}
.chat-input input::placeholder{color:#5d6580}
.chat-input .btn{padding:13px 20px}

.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:7px;letter-spacing:.5px;text-transform:uppercase}
.field input,.field select{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--stroke);border-radius:13px;padding:13px 16px;color:var(--txt);font-size:14px;font-family:inherit;outline:none;transition:.2s}
.field input:focus,.field select:focus{border-color:rgba(255,209,102,.5);box-shadow:0 0 0 3px rgba(255,209,102,.1)}
.field select option{background:#161a2c;color:var(--txt)}
.hint{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.5}

/* --- СЛАЙДЕР ЦЕНЫ --- */
.range-hint{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:700;margin-bottom:8px;flex-wrap:wrap}
.range-hint .rh-min{color:var(--blue)}
.range-hint .rh-mid{color:var(--gold);text-align:center}
.range-hint .rh-max{color:var(--red)}
.range-wrap{margin:12px 0 14px;position:relative}
input[type="range"].price-slider{width:100%;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--blue),var(--violet),var(--gold),var(--orange),var(--red));outline:none;-webkit-appearance:none;appearance:none;cursor:pointer;box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
input[type="range"].price-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:linear-gradient(145deg,var(--gold),var(--gold2));border:2px solid #1a1e30;cursor:pointer;box-shadow:0 4px 12px rgba(255,176,32,.55),inset 0 1px 0 rgba(255,255,255,.4);transition:.15s}
input[type="range"].price-slider::-webkit-slider-thumb:hover{transform:scale(1.15);box-shadow:0 6px 18px rgba(255,176,32,.8),inset 0 1px 0 rgba(255,255,255,.4)}
input[type="range"].price-slider::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:linear-gradient(145deg,var(--gold),var(--gold2));border:2px solid #1a1e30;cursor:pointer;box-shadow:0 4px 12px rgba(255,176,32,.55)}
.price-value-display{text-align:center;font-size:22px;font-weight:900;color:var(--gold);padding:8px;letter-spacing:.5px}

.profile-grid{display:grid;grid-template-columns:1fr 1.35fr;gap:16px}
@media(max-width:760px){.profile-grid{grid-template-columns:1fr}}
.profile-card{background:var(--panel);border:1px solid var(--stroke);border-radius:22px;padding:24px;backdrop-filter:blur(16px);text-align:center;position:relative;overflow:hidden}

  {t:'Бабушка с рынка',greed:0.7,patience:130,chatty:1.4},{t:'Молодой папа',greed:0.95,patience:80,chatty:1.0},
];
const REASONS = {
  'Техника':['купил новую модель, эта лежит без дела','подарили, но я не пользуюсь','перешёл на другой бренд','брал для работы, больше не нужно'],
  'Мебель':['переезжаю в другую квартиру','купил(а) новую, эта не вписалась','наследство от бабушки','сделали ремонт и сменили стиль'],
  'Авто':['пересел на новую машину','машина выходного дня, жалко что стоит','нужны деньги на ремонт квартиры','ездил(а) мало, жалко держать'],
  'Разное':['купил(а) по ошибке','хочу обновить гардероб','больше не увлекаюсь','просто лишняя вещь'],
  'Инструменты':['закончилась стройка','перешёл на другой бренд','осталось от отца','работаю с другим набором'],
  'Спорт':['не хватает времени','пересел(а) на другой вид спорта','купил(а) и забросил(а)','травма, не могу заниматься'],
};
const AVATARS = ['🧑‍💼','👨','👩','🧔','👨‍🦰','👩‍🦱','🧓','👨‍🔧','🦸','🤑','😎','👑','🎩','🐺','🦊','🐱','🤖','🐉'];

/* ===== СОСТОЯНИЕ ===== */
const SAVE_KEY = 'perekup_pro_save_v2';
const SAVE_VERSION = 2;
const START_MONEY = 10000;
const MARKET_TARGET = 60;
const PAGE_SIZE = 12;

const state = {
  player: { name: 'Новичок', avatar: '🧑‍💼', money: START_MONEY },
  inventory: [], listings: [], market: [],
  gameMin: 0, tab: 'market', filter: 'Все',
  page: 1,
  priceMin: 0, priceMax: 99999999,
  pricePreset: 'all',
  stats: { bought: 0, sold: 0, profit: 0 },
  uid: 1, lastSaveOk: false,
};

function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: SAVE_VERSION, ts: Date.now(),
      player: state.player, inventory: state.inventory, listings: state.listings,
      market: state.market, gameMin: state.gameMin, stats: state.stats, uid: state.uid,
    }));
    state.lastSaveOk = true;
  } catch (e) { state.lastSaveOk = false; }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (d.v !== SAVE_VERSION) { localStorage.removeItem(SAVE_KEY); return false; }
    state.player = d.player || { name: 'Новичок', avatar: '🧑‍💼', money: START_MONEY };
    state.inventory = d.inventory || [];
    state.listings = d.listings || [];
    state.market = d.market || [];
    state.stats = d.stats || { bought: 0, sold: 0, profit: 0 };
    state.uid = d.uid || 1;
    state.gameMin = d.gameMin || 0;
    return true;
  } catch (e) { return false; }
}

function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

/* ===== ГЕНЕРАЦИЯ РЫНКА ===== */
function genMarketItem(maxValue) {
  const cutoff = maxValue || Math.max(30000, state.player.money * 2.5);
  let pool = CATALOG.filter(c => c.v <= cutoff);
  if (!pool.length) pool = CATALOG.filter(c => c.v <= cutoff * 3);
  if (!pool.length) pool = CATALOG;
  const base = pick(pool);
  const value = round100(base.v * rnd(0.85, 1.15));
  const trait = pick(NPC_TRAITS);
  const askPrice = round100(value * rnd(1.08, 1.36));
  const minPrice = round100(value * rnd(0.76, 0.94) * trait.greed * 0.95);
  return {
    uid: state.uid++, name: base.n, emoji: base.e, cat: base.c, value, askPrice,
    minPrice: Math.min(minPrice, Math.round(askPrice * 0.93)),
    npc: {
      name: pick(NPC_NAMES), avatar: pick(NPC_AVATARS), trait: trait.t,
      greed: trait.greed, chatty: trait.chatty,
      patience: trait.patience, maxPatience: trait.patience,
    },
  };
}

function refillMarket() {
  const wealth = state.player.money;
  while (state.market.length < MARKET_TARGET) {
    const r = Math.random();
    let maxV;
    if (r < 0.3) maxV = Math.max(2000, wealth * 0.8);
    else if (r < 0.6) maxV = Math.max(15000, wealth * 2);
    else if (r < 0.85) maxV = Math.max(50000, wealth * 5);
    else maxV = Math.max(200000, wealth * 15);
    state.market.push(genMarketItem(maxV));
  }
  let affordable = state.market.filter(i => i.askPrice <= wealth).length;
  if (affordable < 3) {
    for (let i = state.market.length - 1; i >= 0 && affordable < 3; i--) {
      if (state.market[i].askPrice > wealth) {
        const cheap = genMarketItem(Math.max(1500, Math.floor(wealth * 0.7)));
        cheap.askPrice = Math.min(cheap.askPrice, Math.round(wealth * 0.88));
        cheap.minPrice = Math.min(cheap.minPrice, Math.round(cheap.askPrice * 0.85));
        state.market[i] = cheap;
        affordable++;
      }
    }
  }
}

/* ===== ПРОФИЛЬ ===== */
function rankOf() {
  const m = state.player.money;
  if (m < 300000) return 'Любитель';
  if (m < 800000) return 'Перекуп';
  if (m < 2000000) return 'Барыга со стажем';
  if (m < 6000000) return 'Акула рынка';
  if (m < 15000000) return 'Магнат барахолки';
  return 'Легенда перекупа';
}

function renderPlayerBar() {
  $('#playerBar').innerHTML = `<div class="mini-avatar">${state.player.avatar}</div>
    <div><div class="mini-name">${esc(state.player.name)}</div>
    <div class="mini-money" id="moneyLabel">${fmt(state.player.money)}</div></div>`;
}

function popMoney(amount, positive = true) {
  const pop = document.createElement('div');
  pop.className = 'money-pop';
  pop.style.color = positive ? 'var(--green)' : 'var(--red)';
  pop.style.textShadow = positive ? '0 0 16px rgba(52,211,153,.7)' : '0 0 16px rgba(248,113,113,.7)';
  pop.textContent = (positive ? '+' : '−') + fmt(amount);
  document.body.appendChild(pop);
  setTimeout(() => pop.remove(), 1600);
}

function renderTabs() {
  const tabs = [['market','🏷️ Рынок'],['inventory','📦 Склад'],['listings','📢 Мои объявления'],['profile','👤 Профиль']];
  $('#tabs').innerHTML = tabs.map(([id, l]) =>
    `<button class="tab ${state.tab === id ? 'active' : ''}" onclick="setTab('${id}')">${l}</button>`
  ).join('');
}

function setTab(t) { state.tab = t; renderTabs(); renderView(); saveGame(); }

/* ===== РЕНДЕР ===== */
function renderView() {
  renderPlayerBar();
  const v = $('#view');
  switch (state.tab) {
    case 'market': v.innerHTML = marketHTML(); break;
    case 'inventory': v.innerHTML = inventoryHTML(); break;
    case 'listings': v.innerHTML = listingsHTML(); break;
    case 'profile': v.innerHTML = profileHTML(); break;
  }
  updateTimers();
}

/* ===== РЫНОК + ФИЛЬТР + ПАГИНАЦИЯ ===== */
function getFilteredMarket() {
  let items = state.market.filter(i => state.filter === 'Все' || i.cat === state.filter);
  items = items.filter(i => i.askPrice >= state.priceMin && i.askPrice <= state.priceMax);
  return items;
}

function marketHTML() {
  const cats = ['Все', 'Техника', 'Мебель', 'Авто', 'Разное', 'Инструменты', 'Спорт'];
  const allItems = getFilteredMarket();
  const total = allItems.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (state.page > totalPages) state.page = totalPages;
  if (state.page < 1) state.page = 1;
  const start = (state.page - 1) * PAGE_SIZE;
  const pageItems = allItems.slice(start, start + PAGE_SIZE);

  const cards = pageItems.map(i => `
    <div class="card">
      <div class="card-cat" data-cat="${i.cat}">${i.cat}</div>
      <div class="card-emoji">${i.emoji}</div>
      <div class="card-name">${esc(i.name)}</div>
      <div class="card-price">${fmt(i.askPrice)}</div>
      <div class="card-seller">
        <span>${i.npc.avatar}</span><b>${i.npc.name}</b>
        <span class="tag">${i.npc.trait}</span>
      </div>
      <div class="card-actions">
        <button class="btn btn-gold" onclick="openTrade(${i.uid})">💬 Торг</button>
        <button class="btn btn-ghost" onclick="buyNow(${i.uid})">Купить</button>
      </div>
    </div>`).join('');

  const presets = [
    ['all','Все','0','99999999'],
    ['cheap','до 10к','0','10000'],
    ['mid','10–50к','10000','50000'],
    ['high','50–200к','50000','200000'],
    ['premium','200к+','200000','99999999'],
  ];

  const presetHtml = presets.map(([key, label, mn, mx]) =>
    `<button class="pf-preset ${state.pricePreset === key ? 'active' : ''}" onclick="setPricePreset('${key}',${mn},${mx})">${label}</button>`
  ).join('');

  const gridHtml = pageItems.length
    ? `<div class="grid">${cards}</div>`
    : `<div class="empty"><div class="empty-ico">🔍</div><b>Ничего не найдено</b>Попробуй изменить фильтры или диапазон цен</div>`;

  const paginationHtml = total > 0 ? `
    <div class="pagination">
      <div class="pg-info">Показано <b>${Math.min(start + 1, total)}–${Math.min(start + PAGE_SIZE, total)}</b> из <b>${total}</b> · Страница <b>${state.page}</b> из <b>${totalPages}</b></div>
      <div class="pg-controls">
        <button class="page-btn page-nav" onclick="goPage(${state.page - 1})" ${state.page <= 1 ? 'disabled' : ''}>‹ Назад</button>
        ${renderPageButtons(state.page, totalPages)}
        <button class="page-btn page-nav" onclick="goPage(${state.page + 1})" ${state.page >= totalPages ? 'disabled' : ''}>Вперёд ›</button>
      </div>
    </div>` : '';

  return `
    <div class="section-head">
      <div class="section-title">Рынок <span class="cat-badge">📚 ${CATALOG_SIZE} товаров</span></div>
      <div class="filters">
        ${cats.map(c => `<button class="chip ${state.filter === c ? 'active' : ''}" onclick="setFilter('${c}')">${c}</button>`).join('')}
      </div>
    </div>
    <div class="price-filter">
      <span class="pf-label">Цена</span>
      <div class="pf-inputs">
        <input type="number" id="priceMinInput" value="${state.priceMin === 0 ? '' : state.priceMin}" placeholder="от" min="0" step="1000" oninput="onPriceMinInput(this.value)">
        <span class="pf-dash">—</span>
        <input type="number" id="priceMaxInput" value="${state.priceMax >= 99999999 ? '' : state.priceMax}" placeholder="до" min="0" step="1000" oninput="onPriceMaxInput(this.value)">
      </div>
      <div class="pf-presets">${presetHtml}</div>
      <button class="pf-reset" onclick="resetPriceFilter()">✕ Сброс</button>
    </div>
    ${gridHtml}
    ${paginationHtml}`;
}

function renderPageButtons(current, total) {
  if (total <= 1) return '';
  const pages = [];
  if (total <= 7) { for (let i = 1; i <= total; i++) pages.push(i); }
  else {
    pages.push(1);
    if (current > 3) pages.push('...');
    for (let i = Math.max(2, current - 1); i <= Math.min(total - 1, current + 1); i++) pages.push(i);
    if (current < total - 2) pages.push('...');
    pages.push(total);
  }
  return pages.map(p => p === '...' ? '<span class="page-ellipsis">…</span>'
    : `<button class="page-btn ${p === current ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`).join('');
}

function goPage(p) {
  const total = Math.max(1, Math.ceil(getFilteredMarket().length / PAGE_SIZE));
  state.page = clamp(p, 1, total);
  renderView();
  const top = document.querySelector('.section-head');
  if (top) window.scrollTo({ top: top.offsetTop - 20, behavior: 'smooth' });
}

function setFilter(c) { state.filter = c; state.page = 1; renderView(); }

let priceDebounce = null;
function onPriceMinInput(v) {
  state.priceMin = Math.max(0, +v || 0);
  state.pricePreset = 'custom';
  state.page = 1;
  if (state.priceMax < state.priceMin) { state.priceMax = state.priceMin; const mx = document.getElementById('priceMaxInput'); if (mx) mx.value = state.priceMax; }
  clearTimeout(priceDebounce);
  priceDebounce = setTimeout(() => { renderView(); if ($('#priceMinInput')) $('#priceMinInput').focus(); }, 350);
}

function onPriceMaxInput(v) {
  state.priceMax = v === '' ? 99999999 : Math.max(0, +v || 0);
  state.pricePreset = 'custom';
  state.page = 1;
  if (state.priceMax < state.priceMin) { state.priceMin = 0; const mn = document.getElementById('priceMinInput'); if (mn) mn.value = ''; }
  clearTimeout(priceDebounce);
  priceDebounce = setTimeout(() => { renderView(); if ($('#priceMaxInput')) $('#priceMaxInput').focus(); }, 350);
}

function setPricePreset(key, mn, mx) {
  state.pricePreset = key;
  state.priceMin = mn;
  state.priceMax = mx;
  state.page = 1;
  renderView();
}

function resetPriceFilter() {
  state.pricePreset = 'all';
  state.priceMin = 0;
  state.priceMax = 99999999;
  state.page = 1;
  renderView();
}

function buyNow(uid) {
  const it = state.market.find(i => i.uid === uid);
  if (!it) return;
  if (state.player.money < it.askPrice) return toast('💸 Недостаточно денег', 'Нужно ' + fmt(it.askPrice) + ', у тебя ' + fmt(state.player.money));
  state.player.money -= it.askPrice;
  addToInventory(it, it.askPrice);
  state.market = state.market.filter(i => i.uid !== uid);
  refillMarket();
  state.stats.bought++;
  toast('📦 Куплено', `${it.name} за ${fmt(it.askPrice)}`);
  renderView(); popMoney(it.askPrice, false); saveGame();
}

function addToInventory(m, buyPrice) {
  state.inventory.push({
    uid: state.uid++, name: m.name, emoji: m.emoji, cat: m.cat,
    value: m.value, buyPrice,
  });
}

function inventoryHTML() {
  if (!state.inventory.length) return `<div class="section-head"><div class="section-title">Склад <small>пусто</small></div></div>
    <div class="empty"><div class="empty-ico">📦</div><b>Склад пуст</b>Купи что-нибудь на рынке и перепродай дороже</div>`;
  const cards = state.inventory.map(i => {
    const pot = Math.round((i.value * 1.05 - i.buyPrice) / Math.max(i.buyPrice, 1) * 100);
    return `<div class="card">
      <div class="card-cat" data-cat="${i.cat}">${i.cat}</div>
      <div class="card-emoji">${i.emoji}</div>
      <div class="card-name">${esc(i.name)}</div>
      <div class="card-price">${fmt(i.value)}</div>
      <div class="card-seller">
        <span>Куплено за <b>${fmt(i.buyPrice)}</b></span>
        <span class="tag" style="background:${pot >= 0 ? 'rgba(52,211,153,.18)' : 'rgba(248,113,113,.18)'};color:${pot >= 0 ? '#34d399' : '#f87171'}">${pot >= 0 ? '+' : ''}${pot}%</span>
      </div>
      <div class="card-actions">
        <button class="btn btn-gold" onclick="openListForm(${i.uid})">📢 Выставить</button>
      </div>
    </div>`;
  }).join('');
  return `<div class="section-head"><div class="section-title">Склад <small>${state.inventory.length} шт.</small></div></div><div class="grid">${cards}</div>`;
}

function listingsHTML() {
  if (!state.listings.length) return `<div class="section-head"><div class="section-title">Мои объявления</div></div>
    <div class="empty"><div class="empty-ico">📢</div><b>Нет активных объявлений</b>Выстави товар со склада — и жди покупателя</div>`;
  const rows = state.listings.map(L => {
    const ratio = L.price / L.item.value;
    const chance = ratio <= 0.9 ? '🔥 Горячая цена' : ratio <= 1.05 ? '✅ Хорошая цена' : ratio <= 1.2 ? '🕐 Дороговато' : '🧊 Слишком дорого';
    const warn = L.timeLeft < L.total * 0.25;
    return `<div class="listing">
      <div class="l-emoji">${L.item.emoji}</div>
      <div class="l-body"><div class="l-name">${esc(L.item.name)}</div>
        <div class="l-meta"><span class="l-price">${fmt(L.price)}</span><span>${chance}</span></div>
      </div>
      <div class="l-timer ${warn ? 'warn' : ''}" data-tl="${L.uid}">${fmtTime(L.timeLeft)}</div>
      <button class="btn btn-ghost" onclick="cancelListing(${L.uid})">Снять</button>
    </div>`;
  }).join('');
  return `<div class="section-head"><div class="section-title">Мои объявления <small>${state.listings.length} активных</small></div></div>${rows}`;
}

function updateTimers() {
  document.querySelectorAll('[data-tl]').forEach(e => {
    const uid = +e.dataset.tl;
    const L = state.listings.find(l => l.uid === uid);
    if (!L) return;
    e.textContent = fmtTime(L.timeLeft);
    e.classList.toggle('warn', L.timeLeft < L.total * 0.25);
  });
}

function cancelListing(uid) {
  const L = state.listings.find(l => l.uid === uid);
  if (!L) return;
  state.listings = state.listings.filter(l => l.uid !== uid);
  state.inventory.push(L.item);
  closeModal();
  toast('↩️ Объявление снято', L.item.name + ' вернулся на склад');
  renderView(); saveGame();
}

function profileHTML() {
  return `<div class="section-head"><div class="section-title">Профиль</div></div>
  <div class="profile-grid">
    <div class="profile-card">
      <div class="big-avatar">${state.player.avatar}</div>
      <div class="profile-name">${esc(state.player.name)}</div>
      <div class="profile-rank">${rankOf()}</div>
      <div class="stats">
        <div class="stat"><div class="stat-v">${state.stats.bought}</div><div class="stat-l">Куплено</div></div>
        <div class="stat"><div class="stat-v">${state.stats.sold}</div><div class="stat-l">Продано</div></div>
        <div class="stat"><div class="stat-v">${fmt(state.stats.profit)}</div><div class="stat-l">Прибыль</div></div>
      </div>
      <div class="save-badge ${state.lastSaveOk ? 'pulse' : ''}">💾 Автосохранение активно</div>
    </div>
    <div class="profile-card" style="text-align:left">
      <div class="field"><label>Никнейм</label>
        <input id="nickInput" maxlength="16" value="${esc(state.player.name)}" placeholder="Введи ник..."></div>
      <button class="btn btn-gold" style="width:100%" onclick="saveNick()">💾 Сохранить ник</button>
      <div style="margin-top:22px">
        <label style="display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:7px;letter-spacing:.5px;text-transform:uppercase">Аватар</label>
        <div class="avatar-grid">${AVATARS.map(a => `<div class="av-opt ${state.player.avatar === a ? 'sel' : ''}" onclick="setAvatar('${a}')">${a}</div>`).join('')}</div>
      </div>
      <button class="btn btn-red" style="width:100%;margin-top:22px" onclick="resetGame()">🔄 Начать заново</button>
    </div>
  </div>`;
}

function saveNick() {
  const v = $('#nickInput').value.trim();
  if (v.length < 2) return toast('⚠️ Слишком короткий ник', 'Минимум 2 символа');
  state.player.name = v.slice(0, 16);
  renderPlayerBar(); renderView(); saveGame();
  toast('✅ Ник изменён', 'Теперь ты ' + state.player.name);
}
function setAvatar(a) { state.player.avatar = a; renderPlayerBar(); renderView(); saveGame(); }

function resetGame() {
  if (!confirm('Начать заново? Прогресс и сохранение будут удалены.')) return;
  clearSave(); newGame(); renderView();
  toast('🔄 Новая игра', 'Стартовый капитал ' + fmt(START_MONEY));
}

function newGame() {
  state.player = { name: 'Новичок', avatar: '🧑‍💼', money: START_MONEY };
  state.inventory = []; state.listings = []; state.market = [];
  state.stats = { bought: 0, sold: 0, profit: 0 };
  state.uid = 1; state.gameMin = 0; state.page = 1;
  state.filter = 'Все'; state.priceMin = 0; state.priceMax = 99999999; state.pricePreset = 'all';
  for (let i = 0; i < 3; i++) {
    const cheap = CATALOG.filter(c => c.v <= 5000);
    const b = pick(cheap);
    const val = round100(b.v);
    state.inventory.push({
      uid: state.uid++, name: b.n, emoji: b.e, cat: b.c,
      value: val, buyPrice: round100(val * 0.5),
    });
  }
  refillMarket(); saveGame();
}

/* ===== МОДАЛКИ ===== */
function showModal(html, wide) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="overlay" id="overlay"><div class="modal" style="${wide ? 'max-width:640px' : ''}">${html}</div></div>`;
  requestAnimationFrame(() => { const o = $('#overlay'); if (o) o.classList.add('show'); });
}
function closeModal() {
  const o = $('#overlay');
  if (!o) return;
  o.classList.remove('show');
  setTimeout(() => { if (!$('#overlay') || !$('#overlay').classList.contains('show')) $('#modal-root').innerHTML = ''; }, 240);
}

/* ===== ПАРСИНГ ЧИСЕЛ ===== */
function extractNumber(text) {
  const t = text.toLowerCase().replace(/\s+/g, '');
  if (/\d+\s*%/.test(text)) return null;
  if (/полтос|полтинник/.test(t)) return 50000;
  if (/сотка|сотня/.test(t) && !/\d/.test(t)) return 100000;
  if (/двушка|двушку/.test(t)) return 200000;
  if (/пятнашка|пятнашку/.test(t)) return 150000;
  if (/лимон|лям|мульт/.test(t)) {
    const m = t.match(/(\d+(?:[.,]\d+)?)(?:лимон|лям|мульт)/);
    if (m) return Math.round(parseFloat(m[1].replace(',', '.')) * 1000000);
    return 1000000;
  }
  const m = t.match(/(\d+(?:[.,]\d+)?)(кк|к|k|тыс|тысяч|тыщи|млн)?/);
  if (!m) return null;
  let n = parseFloat(m[1].replace(',', '.'));
  if (isNaN(n)) return null;
  const suf = m[2];
  if (suf === 'к' || suf === 'кк' || suf === 'k' || suf === 'тыс' || suf === 'тысяч' || suf === 'тыщи') n *= 1000;
  else if (suf === 'млн') n *= 1000000;
  return Math.round(n);
}

/* ===== ИНТЕНТЫ ===== */
function detectIntents(text) {
  const t = text.toLowerCase();
  const r = [];
  if (/(скидк|дешев|торг|уступ|сбав|сниз|подешев|перекуп)/.test(t)) r.push('ask_discount');
  if (/(дорого|дороговат|слишком|перебор|обдирал|грабёж|грабеж)/.test(t)) r.push('too_expensive');
  if (/(состоян|дефект|царап|б\/у|бу|провер|осмотр|работает|исправн)/.test(t)) r.push('ask_condition');
  if (/(привет|здравств|добр|хай|салют|дороу)/.test(t)) r.push('greeting');
  if (/(беру|забираю|согласен|договорил|по рукам|идёт|идет)/.test(t) && !/\d/.test(text)) r.push('accept');
  if (/(доставк|самовывоз|курьер|привез|привезти|отправ)/.test(t)) r.push('ask_delivery');
  if (/(срочн|сегодня|сейчас|быстр|побыстрей|заберу)/.test(t)) r.push('urgency');
  if (/(пакет|несколько|оптом|вместе|оба|два|три)/.test(t)) r.push('bundle');
  if (/(назови|скажи|какая|какую|сколько стоит|сколько хочешь|почём|почем|назовите)/.test(t)) r.push('ask_price');
  if (/(спасибо|благодар|пожалуйста|извините)/.test(t)) r.push('polite');
  if (/(обман|кидал|развод|подвох|проверк|довер)/.test(t)) r.push('distrust');
  if (/(комплект|коробк|документ|чек|гарантийн|упаковк)/.test(t)) r.push('ask_accessories');
  if (/(причин|почему прода|зачем прода|с чего)/.test(t)) r.push('ask_reason');
  if (/(как давно|когда куп|сколько польз)/.test(t)) r.push('ask_age');
  return r;
}

/* ===== ТОРГ С ПРОДАВЦОМ ===== */
let tradeChat = null;

function openTrade(uid) {
  const item = state.market.find(i => i.uid === uid);
  if (!item) return;
  tradeChat = { item, messages: [], done: false, turns: 0, lastOffer: null, repeats: 0, discussed: new Set() };
  const it = item;
  npcSay(pick([
    `Здравствуйте! Продаю ${it.name} за ${fmt(it.askPrice)}. Торг уместен.`,
    `Приветствую. ${it.name}, состояние отличное. Прошу ${fmt(it.askPrice)}.`,
    `Добрый день! ${it.name} в продаже. Цена — ${fmt(it.askPrice)}, можем обсудить.`,
    `Привет! ${it.name}, ${pick(REASONS[it.cat])}. Хочу ${fmt(it.askPrice)}.`,
  ]));
  renderTradeModal();
}

function npcSay(t) { tradeChat.messages.push({ who: 'npc', text: t }); }
function meSay(t) { tradeChat.messages.push({ who: 'me', text: t }); }
function sysSay(t, c) { tradeChat.messages.push({ who: 'sys', text: t, cls: c }); }

function renderTradeModal() {
  const it = tradeChat.item;
  showModal(`
    <div class="modal-head">
      <div class="mh-avatar">${it.npc.avatar}</div>
      <div><div class="mh-name">${it.npc.name}</div>
        <div class="mh-sub">${it.npc.trait} · терпение ${Math.max(0, Math.round(it.npc.patience))}%</div></div>
      <button class="close-x" onclick="closeModal()">✕</button>
    </div>
    <div class="trade-item">
      <div class="ti-emoji">${it.emoji}</div>
      <div><div class="ti-name">${esc(it.name)}</div>
        <div class="ti-price">Запрос продавца: ${fmt(it.askPrice)}</div></div>
    </div>
    <div class="chat" id="chatBox"></div>
    <div class="chat-quick" id="quickBtns"></div>
    <div class="chat-input">
      <input id="chatField" placeholder="Напиши цену или вопрос..." onkeydown="if(event.key==='Enter')sendTradeMsg()">
      <button class="btn btn-gold" onclick="sendTradeMsg()">➤</button>
    </div>
  `);
  renderChatBox(); renderQuickBtns();
  setTimeout(() => { const f = $('#chatField'); if (f) f.focus(); }, 120);
}

function renderChatBox() {
  const box = $('#chatBox');
  if (!box) return;
  const av = tradeChat.item.npc.avatar;
  box.innerHTML = tradeChat.messages.map(m => {
    if (m.who === 'sys') return `<div class="msg-sys ${m.cls || ''}">${m.text}</div>`;
    if (m.who === 'me') return `<div class="msg me"><div class="msg-av">${state.player.avatar}</div><div class="msg-bubble">${m.text}</div></div>`;
    return `<div class="msg npc"><div class="msg-av">${av}</div><div class="msg-bubble">${m.text}</div></div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

function renderQuickBtns() {
  const box = $('#quickBtns');
  if (!box) return;
  if (tradeChat.done) { box.innerHTML = ''; return; }
  const it = tradeChat.item;
  const b1 = round100(it.askPrice * 0.85);
  const b2 = round100(it.askPrice * 0.72);
  box.innerHTML = `
    <button class="qbtn" onclick="quickOffer(${b1})">Предложить ${fmt(b1)}</button>
    <button class="qbtn" onclick="quickOffer(${b2})">Предложить ${fmt(b2)}</button>
    <button class="qbtn" onclick="quickOffer(${it.askPrice})">Беру за ${fmt(it.askPrice)}</button>
    <button class="qbtn" onclick="quickText('А скидку сделаете?')">«Скидку?»</button>
    <button class="qbtn" onclick="quickText('Расскажите о состоянии')">«Состояние?»</button>
    <button class="qbtn" onclick="quickText('Почему продаёте?')">«Причина продажи?»</button>`;
}

function quickOffer(n) {
  const f = $('#chatField'); if (f) f.value = '';
  meSay('Предлагаю ' + fmt(n));
  handleTradeOffer(n, []);
}
function quickText(t) { meSay(t); handleTradeMessage(t); }

function sendTradeMsg() {
  const f = $('#chatField');
  if (!f) return;
  const text = f.value.trim();
  if (!text) return;
  f.value = '';
  meSay(esc(text));
  handleTradeMessage(text);
}

function handleTradeMessage(text) {
  const it = tradeChat.item, tc = tradeChat;
  const intents = detectIntents(text);
  const offer = extractNumber(text);
  tc.turns++;
  intents.forEach(i => tc.discussed.add(i));
  if (intents.includes('polite')) it.npc.patience = Math.min(it.npc.maxPatience, it.npc.patience + 4);
  if (offer !== null) {
    if (tc.lastOffer === offer) tc.repeats++; else tc.repeats = 0;
    tc.lastOffer = offer;
    return handleTradeOffer(offer, intents);
  }
  if (intents.includes('greeting') && tc.turns <= 2) {
    npcSay(pick([`Здравствуйте! Да, ${it.name} ещё в продаже. Слушаю вас.`, `Привет-привет! Ну что, берёте ${it.name}?`, `Добрый день. Да, всё актуально. Что интересует?`]));
  } else if (intents.includes('ask_condition')) {
    if (tc.discussed.has('_c')) npcSay('Я же уже говорил — состояние нормальное. Ты по цене что скажешь?');
    else { tc.discussed.add('_c'); it.npc.patience -= 2; npcSay(pick([`Состояние честное — ${it.name} полностью рабочий, есть мелкие следы использования.`, `Всё в порядке, никаких дефектов. Можешь проверить лично.`, `Работает как часы. Пара царапин, но на функционал не влияет.`, `Состояние хорошее. Если хочешь — можем встретиться.`])); }
  } else if (intents.includes('ask_accessories')) {
    if (tc.discussed.has('_a')) npcSay('Уже отвечал по комплекту. Всё, что было, отдаю.');
    else { tc.discussed.add('_a'); it.npc.patience -= 2; npcSay(pick([`Комплект полный — коробка, документы, всё на месте.`, `Коробки нет, но чек и все причиндалы отдам.`, `Всё, что на фото, всё ваше.`])); }
  } else if (intents.includes('ask_reason')) {
    tc.discussed.add('_r'); npcSay(pick([`Да просто — ${pick(REASONS[it.cat])}. Решил продать, пока не поздно.`, `Причина простая: ${pick(REASONS[it.cat])}.`]));
  } else if (intents.includes('ask_delivery')) {
    it.npc.patience -= 3; npcSay(pick([`Самовывоз, конечно. Могу встретиться в центре.`, `Давай самовывозом. Мне так спокойнее.`, `Только самовывоз. Доставка — это уже твои заботы.`]));
  } else if (intents.includes('ask_price')) {
    it.npc.patience -= 2; npcSay(pick([`Прошу ${fmt(it.askPrice)}, но могу подвинуться для серьёзного покупателя.`, `${fmt(it.askPrice)} — вот моя цена. Что скажешь?`, `Изначально ${fmt(it.askPrice)}. Торг возможен.`]));
  } else if (intents.includes('too_expensive')) {
    it.npc.patience -= 6; npcSay(pick([`Дорого? Сравни с рынком — у меня ещё по-божески. Назови свою цену.`, `Так это же ${it.name}, не абы что. Сколько готов дать?`, `Могу немного скинуть, но не жди половину. Говори цифру.`]));
  } else if (intents.includes('ask_discount')) {
    it.npc.patience -= 8;
    if (tc.discussed.has('_d')) npcSay('Ты уже просил скидку. Назови свою цену, и обсудим.');
    else { tc.discussed.add('_d'); const np = round100(it.askPrice * rnd(0.88, 0.95)); it.askPrice = Math.min(it.askPrice, np); npcSay(pick([`Ладно, сделаю скидку — ${fmt(np)}. Но это предел.`, `Хорошо, скину. ${fmt(np)}, и расходимся.`, `Уговорил. ${fmt(np)} — окончательная.`])); }
  } else if (intents.includes('distrust')) {
    it.npc.patience -= 15; if (it.npc.patience <= 0) return npcLeaves();
    npcSay(pick(['Слушай, я не мошенник. Не хочешь — не бери.', 'За кого ты меня принимаешь? Всё честно.', 'Если не доверяешь — просто не покупай.']));
  } else if (intents.includes('accept')) {
    if (it.askPrice <= state.player.money) return acceptSellerDeal(it.askPrice);
    npcSay(`Рад, что согласен! Но у тебя же нет ${fmt(it.askPrice)}?`); it.npc.patience -= 5;
  } else if (intents.includes('urgency')) {
    it.npc.patience -= 3; npcSay(pick(['Торопишься? Хорошо, тогда назови адекватную цену — и забирай.', 'Раз срочно — я тоже не хочу тянуть. Твоё предложение?', 'Если заберёшь сегодня — немного уступлю.']));
  } else if (intents.includes('bundle')) {
    npcSay('У меня только один экземпляр. Так что пакета не будет.');
  } else if (intents.includes('ask_age')) {
    it.npc.patience -= 2; npcSay(pick([`Пользуюсь примерно ${Math.floor(rnd(1, 4))} года. Всё как новое.`, `Купил(а) относительно недавно, почти не использовал(а).`, `Брал(а) ещё в прошлом году. Всё работает.`]));
  } else {
    it.npc.patience -= 5; npcSay(pick(['Так, давай ближе к делу. Сколько предлагаешь?', 'Не понял вопроса. По цене что скажешь?', 'Хорош болтать — называй сумму.', 'Ты мне зубы не заговаривай. Назови цену.']));
  }
  if (it.npc.patience <= 0) return npcLeaves();
  finishTurn();
}

function handleTradeOffer(num, intents) {
  const it = tradeChat.item, tc = tradeChat;
  if (num > state.player.money) {
    npcSay(pick([`Слушай, у тебя же нет ${fmt(num)}. У тебя всего ${fmt(state.player.money)}.`, `Ты сначала деньги покажи, потом такую цену называй.`, `Хорошая шутка. Но у тебя нет столько.`]));
    it.npc.patience -= 8; if (it.npc.patience <= 0) return npcLeaves();
    return finishTurn();
  }
  if (num >= it.minPrice) return acceptSellerDeal(num);
  if (tc.repeats >= 2) {
    it.npc.patience -= 25; if (it.npc.patience <= 0) return npcLeaves();
    npcSay(pick(['Ты уже предлагал столько же. Я своё слово сказал.', 'Сколько раз повторять? Не пойдёт за эту сумму.', 'Ты меня не слышишь. Другую цену назови.']));
    return finishTurn();
  }
  const gap = it.minPrice - num, gapRatio = gap / it.minPrice;
  if (gapRatio <= 0.06) {
    it.npc.patience -= 6;
    if (Math.random() < 0.45 || intents.includes('accept')) return acceptSellerDeal(num);
    const c = round100(Math.min(num * 1.06, it.minPrice));
    npcSay(pick([`Почти договорились. ${fmt(c)} — и по рукам.`, `Ещё чуть-чуть. Давай ${fmt(c)}, и забирай.`, `Согласен почти. Добавь до ${fmt(c)} — и расходимся.`]));
  } else if (gapRatio <= 0.15) {
    it.npc.patience -= 14;
    const c = round100(it.minPrice * rnd(1.0, 1.03));
    npcSay(pick([`${fmt(num)} мало. ${fmt(c)} — и забирай.`, `Добавь до ${fmt(c)}, и договорились.`, `Могу отдать за ${fmt(c)}, но не меньше.`]));
  } else if (gapRatio <= 0.3) {
    it.npc.patience -= 22;
    const c = round100(it.minPrice * rnd(1.03, 1.08));
    npcSay(pick([`Серьёзно? ${fmt(num)} — это сильно ниже. Минимум ${fmt(c)}.`, `Не пойдёт за ${fmt(num)}. Реальная цена — ${fmt(c)}.`, `${fmt(c)}, и я закрою глаза на твою наглость.`]));
  } else {
    it.npc.patience -= 35; if (it.npc.patience <= 0) return npcLeaves();
    const c = round100(it.minPrice * rnd(1.05, 1.12));
    npcSay(pick([`За ${fmt(num)} я даже разговаривать не буду. ${fmt(c)} — вот это разговор.`, `Ты издеваешься? Такое и за ${fmt(c)} не каждый день.`, `Ха-ха, ${fmt(num)}. Назови реальную цену.`]));
  }
  if (it.npc.patience <= 0) return npcLeaves();
  finishTurn();
}

function npcLeaves() {
  tradeChat.done = true;
  npcSay(pick(['Всё, терпение лопнуло. Не хочу больше с тобой торговаться. 👋', 'Устал я от этого торга. Продам другому.', 'Хватит. Настроение пропало.', 'Не умеешь ты торговаться. Всё, до свидания.']));
  sysSay('Продавец ушёл из чата', 'bad');
  state.market = state.market.filter(x => x.uid !== tradeChat.item.uid);
  refillMarket(); saveGame();
  renderChatBox(); renderQuickBtns();
  setTimeout(() => { if ($('#chatBox')) { closeModal(); renderView(); } }, 1800);
}

function acceptSellerDeal(price) {
  const it = tradeChat.item;
  tradeChat.done = true;
  state.player.money -= price;
  addToInventory(it, price);
  state.market = state.market.filter(x => x.uid !== it.uid);
  refillMarket(); state.stats.bought++;
  npcSay(pick([`По рукам! 🤝 Забирай за ${fmt(price)}.`, `Договорились! ${fmt(price)} — и вещь твоя.`, `Отлично, ${fmt(price)}. Спасибо!`]));
  sysSay(`Вы купили «${esc(it.name)}» за ${fmt(price)}`, 'ok');
  renderChatBox(); renderQuickBtns(); renderPlayerBar();
  saveGame(); popMoney(price, false);
  setTimeout(() => { closeModal(); renderView(); }, 1500);
}

function finishTurn() { renderChatBox(); renderQuickBtns(); renderPlayerBar(); }

      <button class="close-x" onclick="closeModal()">✕</button>
    </div>
    <div class="field">
      <label>Цена продажи</label>
      <div class="range-hint">
        <span class="rh-min">Мин: ${fmt(minRec)}</span>
        <span class="rh-mid">Рекомендуем: ${fmt(item.value)}</span>
        <span class="rh-max">Макс: ${fmt(maxRec)}</span>
      </div>
      <div class="price-value-display" id="priceDisplay">${fmt(suggested)}</div>
      <div class="range-wrap">
        <input type="range" class="price-slider" id="priceSlider" min="${minRec}" max="${maxRec}" value="${suggested}" step="100" oninput="syncPriceFromSlider(this.value)">
      </div>
      <input type="number" id="sellPrice" value="${suggested}" min="100" step="100" oninput="syncPriceFromInput(this.value)">

    </div>
    <div class="field">
      <label>Срок размещения</label>
      <select id="sellDur">
        <option value="1">1 час — быстро</option>
        <option value="3">3 часа</option>
        <option value="6" selected>6 часов — оптимально</option>
        <option value="12">12 часов</option>
        <option value="24">24 часа — максимум</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Отмена</button>
      <button class="btn btn-gold" style="flex:1.4" onclick="createListing(${invUid})">📢 Выставить</button>

function syncPriceFromSlider(v) {
  const inp = document.getElementById('sellPrice');
  if (inp) inp.value = v;
  const disp = document.getElementById('priceDisplay');
  if (disp) disp.textContent = fmt(+v);
}

function syncPriceFromInput(v) {
  const slider = document.getElementById('priceSlider');
  if (!slider) return;
  const min = +slider.min, max = +slider.max, num = +v;
  if (num >= min && num <= max) slider.value = num;
  const disp = document.getElementById('priceDisplay');
  if (disp) disp.textContent = fmt(Math.max(100, num || 0));
}

function createListing(invUid) {
  const item = state.inventory.find(i => i.uid === invUid);
  if (!item) return;
  const price = Math.max(100, Math.round(+$('#sellPrice').value || 0));
  const dur = +$('#sellDur').value;
  if (!price || price < 100) return toast('⚠️ Некорректная цена', 'Минимум 100 ₽');
  state.inventory = state.inventory.filter(i => i.uid !== invUid);
  state.listings.push({ uid: state.uid++, item, price, total: dur * 60, timeLeft: dur * 60, cooldown: 0, buyer: null });
  closeModal();
  state.tab = 'listings'; renderTabs(); renderView(); saveGame();
  toast('📢 Объявление опубликовано', `${item.name} за ${fmt(price)} · ${dur} ч`);
}

/* ===== ИГРОВОЙ ТИК ===== */
const TICK_MIN = 6;
function gameTick() {
  state.gameMin += TICK_MIN;
  let changed = false;
  for (const L of [...state.listings]) {
    if (L.cooldown > 0) L.cooldown -= TICK_MIN;
    L.timeLeft -= TICK_MIN;
    if (L.timeLeft <= 0) {
      state.listings = state.listings.filter(x => x.uid !== L.uid);
      state.inventory.push(L.item);
      toast('⌛ Срок истёк', `${L.item.name} вернулся на склад`);
      changed = true; saveGame(); continue;
    }
    if (L.cooldown <= 0 && !L.buyer) {
      const r = L.price / L.item.value;
      let pPerHour = 0.5 - (r - 0.8) * 1.0;
      pPerHour = clamp(pPerHour, 0.012, 0.6);
      if (Math.random() < pPerHour * (TICK_MIN / 60)) { spawnBuyer(L); saveGame(); }
    }
  }
  if (changed) renderView(); else updateTimers();
}

function spawnBuyer(L) {
  L.buyer = {
    name: pick(NPC_NAMES), avatar: pick(NPC_AVATARS),
    offer: round100(L.price * rnd(0.84, 0.98)),
    maxPrice: round100(L.price * rnd(1.0, 1.13)),
    messages: [], done: false, lastOffer: null,
  };
  toastBuyer(L);
}

function toastBuyer(L) {
  const b = L.buyer;
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<div class="toast-ico">${b.avatar}</div>
    <div class="toast-body"><div class="toast-title">${b.name} интересуется</div>
      <div>«${esc(L.item.name)}» — предлагает <b style="color:var(--gold)">${fmt(b.offer)}</b></div>
      <button class="btn btn-gold" onclick="this.closest('.toast').remove(); openBuyerChat(${L.uid})">Ответить</button>
    </div>`;
  $('#toasts').appendChild(t);
  setTimeout(() => { if (t.parentNode) { t.classList.add('out'); setTimeout(() => t.remove(), 320); } }, 22000);
}

/* ===== ЧАТ С ПОКУПАТЕЛЕМ ===== */
let buyChat = null;
function openBuyerChat(uid) {
  const L = state.listings.find(l => l.uid === uid);
  if (!L || !L.buyer) return;
  buyChat = L;
  const b = L.buyer;
  if (!b.messages.length) b.messages.push({
    who: 'npc',
    text: pick([`Здравствуйте! Увидел объявление «${L.item.name}» за ${fmt(L.price)}. Готов взять за ${fmt(b.offer)}.`, `Добрый день. Интересует «${L.item.name}». Предлагаю ${fmt(b.offer)}.`, `Привет! По объявлению. ${fmt(b.offer)} — и я выезжаю.`])
  });
  renderBuyerModal();
}

function renderBuyerModal() {
  const L = buyChat, b = L.buyer;
  showModal(`
    <div class="modal-head">
      <div class="mh-avatar">${b.avatar}</div>
      <div><div class="mh-name">${b.name}</div>
        <div class="mh-sub">Покупатель · торг по объявлению</div></div>
      <button class="close-x" onclick="closeModal()">✕</button>
    </div>
    <div class="trade-item">
      <div class="ti-emoji">${L.item.emoji}</div>
      <div><div class="ti-name">${esc(L.item.name)}</div>
        <div class="ti-price">Ваша цена: ${fmt(L.price)}</div></div>
    </div>
    <div class="chat" id="chatBox"></div>
    <div class="chat-quick" id="quickBtns"></div>
    <div class="chat-input">
      <input id="chatField" placeholder="Назови свою цену..." onkeydown="if(event.key==='Enter')sendBuyMsg()">
      <button class="btn btn-gold" onclick="sendBuyMsg()">➤</button>
    </div>
  `);
  renderBuyerChatBox(); renderBuyerQuick();
  setTimeout(() => { const f = $('#chatField'); if (f) f.focus(); }, 120);
}

function renderBuyerChatBox() {
  const box = $('#chatBox');
  if (!box) return;
  const b = buyChat.buyer;
  box.innerHTML = b.messages.map(m => {
    if (m.who === 'sys') return `<div class="msg-sys ${m.cls || ''}">${m.text}</div>`;
    if (m.who === 'me') return `<div class="msg me"><div class="msg-av">${state.player.avatar}</div><div class="msg-bubble">${m.text}</div></div>`;
    return `<div class="msg npc"><div class="msg-av">${b.avatar}</div><div class="msg-bubble">${m.text}</div></div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

function renderBuyerQuick() {
  const box = $('#quickBtns');
  if (!box) return;
  const b = buyChat.buyer;
  if (b.done) { box.innerHTML = ''; return; }
  box.innerHTML = `
    <button class="qbtn" onclick="acceptBuyerOffer()">✅ Принять ${fmt(b.offer)}</button>
    <button class="qbtn" onclick="buyerCounter(${buyChat.price})">Настаивать на ${fmt(buyChat.price)}</button>
    <button class="qbtn" onclick="rejectBuyer()">❌ Отказать</button>`;
}

function buySys(t, c) { buyChat.buyer.messages.push({ who: 'sys', text: t, cls: c }); }

function sendBuyMsg() {
  const f = $('#chatField');
  if (!f) return;
  const text = f.value.trim();
  if (!text) return;
  f.value = '';
  buyChat.buyer.messages.push({ who: 'me', text: esc(text) });
  const num = extractNumber(text);
  const intents = detectIntents(text);
  if (num !== null) return buyerCounter(num, intents);
  const b = buyChat.buyer;
  if (intents.includes('ask_condition')) b.messages.push({ who: 'npc', text: 'А есть какие-то дефекты? Хочу знать заранее.' });
  else if (intents.includes('greeting') && b.messages.length <= 2) b.messages.push({ who: 'npc', text: 'Да, я по объявлению. Готов обсудить.' });
  else if (intents.includes('ask_delivery')) b.messages.push({ who: 'npc', text: 'Самовывоз удобнее. Когда можно подъехать?' });
  else if (intents.includes('ask_accessories')) b.messages.push({ who: 'npc', text: 'Комплект полный? Коробка, документы?' });
  else if (intents.includes('ask_discount')) b.messages.push({ who: 'npc', text: 'Если скинете — возьму прямо сейчас.' });
  else b.messages.push({ who: 'npc', text: pick(['Так что по цене? Назовите цифру.', 'Сколько хотите?', 'Мне нужно понимать итоговую сумму.']) });
  renderBuyerChatBox(); renderBuyerQuick();
}

function acceptBuyerOffer() {
  const L = buyChat;
  if (!L || L.buyer.done) return;
  L.buyer.done = true;
  L.buyer.messages.push({ who: 'npc', text: 'Отлично! Договорились 🤝' });
  buySys(`Сделка: ${esc(L.item.name)} за ${fmt(L.buyer.offer)}`, 'ok');
  renderBuyerChatBox(); renderBuyerQuick();
  completeSale(L, L.buyer.offer);
  setTimeout(() => closeModal(), 1400);
}

function rejectBuyer() {
  const L = buyChat;
  if (!L || L.buyer.done) return;
  L.buyer.done = true;
  L.buyer.messages.push({ who: 'npc', text: 'Жаль. Если передумаете — я на связи.' });
  buySys('Покупатель ушёл', 'bad');
  renderBuyerChatBox(); renderBuyerQuick();
  L.buyer = null; L.cooldown = 20; saveGame();
  setTimeout(() => closeModal(), 1200);
}

function buyerCounter(amount, intents = []) {
  const L = buyChat;
  if (!L || L.buyer.done) return;
  const b = L.buyer;
  if (amount <= b.maxPrice) {
    b.done = true;
    b.messages.push({ who: 'npc', text: pick([`Хорошо, ${fmt(amount)} меня устраивает. Беру!`, `Ладно, за ${fmt(amount)}. Когда забрать?`, `Согласен на ${fmt(amount)}. Сделка!`]) });
    buySys(`Сделка: ${esc(L.item.name)} за ${fmt(amount)}`, 'ok');
    renderBuyerChatBox(); renderBuyerQuick();
    completeSale(L, amount);
    setTimeout(() => closeModal(), 1400);
  } else if (amount <= b.maxPrice * 1.14) {
    if (b.lastOffer === amount) b.messages.push({ who: 'npc', text: 'Я же сказал — больше не дам.' });
    else {
      b.offer = round100(b.maxPrice);
      b.messages.push({ who: 'npc', text: pick([`Больше ${fmt(b.maxPrice)} не дам. По рукам?`, `Бюджет до ${fmt(b.maxPrice)}. Согласны?`, `Выше ${fmt(b.maxPrice)} не пойду.`]) });
    }
    b.lastOffer = amount;
    renderBuyerChatBox(); renderBuyerQuick();
  } else {
    b.done = true;
    b.messages.push({ who: 'npc', text: pick([`${fmt(amount)}? Слишком дорого. Не договоримся.`, 'За такие деньги лучше новый возьму.', 'Ну это перебор. Я пас.']) });
    buySys('Покупатель отказался', 'bad');
    renderBuyerChatBox(); renderBuyerQuick();
    L.buyer = null; L.cooldown = 25; saveGame();
    setTimeout(() => closeModal(), 1300);
  }
}

function completeSale(L, price) {
  state.player.money += price;
  state.listings = state.listings.filter(x => x.uid !== L.uid);
  state.stats.sold++;
  state.stats.profit += price - L.item.buyPrice;
  toast('💰 Продано!', `${L.item.name} за ${fmt(price)} · профит ${fmt(price - L.item.buyPrice)}`);
  renderPlayerBar(); renderView(); popMoney(price, true); saveGame();
}

/* ===== ТОСТЫ ===== */
function toast(title, text) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<div class="toast-ico">🔔</div><div class="toast-body"><div class="toast-title">${title}</div><div>${text || ''}</div></div>`;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, 4200);
}

/* ===== СТАРТ ===== */
function init() {
  if (!loadGame()) newGame();
  else { refillMarket(); setTimeout(() => toast('💾 Сохранение загружено', `${state.player.name} · ${fmt(state.player.money)}`), 400); }
  renderTabs(); renderView();
  setInterval(gameTick, 1000);
  setInterval(saveGame, 5000);
  window.addEventListener('beforeunload', saveGame);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
}

init();
</script>
